<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Sửa loại phòng</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/loai-phong}">Loại phòng</a></li>
                    <li class="breadcrumb-item active">Chỉnh sửa</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-warning py-3">
                            <h5 class="mb-0 fs-6 fw-bold text-dark"><i data-lucide="edit" class="me-2"></i> Chỉnh sửa
                                loại phòng</h5>
                        </div>
                        <div class="card-body p-4">
                            <div id="loadingState" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Đang tải...</span>
                                </div>
                                <p class="mt-2 text-muted">Đang tải thông tin loại phòng...</p>
                            </div>

                            <form id="editForm" style="display:none;">
                                <div class="row">
                                    <div class="col-md-8 mb-4">
                                        <label for="tenLoai" class="form-label fw-bold">Tên loại phòng <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control form-control-lg" id="tenLoai" required>
                                    </div>
                                    <div class="col-md-4 mb-4">
                                        <label for="soPhong" class="form-label fw-bold">Số phòng</label>
                                        <input type="number" class="form-control form-control-lg" id="soPhong" min="0">
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="moTa" class="form-label fw-bold">Mô tả</label>
                                    <textarea class="form-control" id="moTa" rows="4"></textarea>
                                </div>
                                <hr class="my-4">
                                <div class="d-flex gap-2 justify-content-end">
                                    <a th:href="@{/admin/loai-phong}" class="btn btn-light px-4">
                                        <i data-lucide="x" class="me-1"></i> Hủy
                                    </a>
                                    <button type="submit" class="btn btn-warning px-4 text-dark">
                                        <i data-lucide="save" class="me-1"></i> Cập nhật thay đổi
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            const id = /*[[${id}]]*/ 0;

            document.addEventListener('DOMContentLoaded', () => {
                loadData();
                lucide.createIcons();
            });

            function loadData() {
                fetch(`/api/admin/loai-phong/${id}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            const item = data.data;
                            document.getElementById('tenLoai').value = item.tenLoai;
                            document.getElementById('soPhong').value = item.soPhong || 0;
                            document.getElementById('moTa').value = item.moTa || '';

                            document.getElementById('loadingState').style.display = 'none';
                            document.getElementById('editForm').style.display = 'block';
                        } else {
                            alert('Không tìm thấy thông tin loại phòng');
                            window.location.href = '/admin/loai-phong';
                        }
                    })
                    .catch(e => {
                        console.error('Error:', e);
                        alert('Có lỗi xảy ra khi tải dữ liệu');
                    });
            }

            document.getElementById('editForm').addEventListener('submit', function (e) {
                e.preventDefault();
                const data = {
                    tenLoai: document.getElementById('tenLoai').value,
                    moTa: document.getElementById('moTa').value,
                    soPhong: document.getElementById('soPhong').value ? parseInt(document.getElementById('soPhong').value) : 0
                };
                fetch(`/api/admin/loai-phong/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            alert('Cập nhật thành công!');
                            window.location.href = '/admin/loai-phong';
                        } else {
                            alert('Lỗi: ' + (data.message || 'Không thể cập nhật'));
                        }
                    })
                    .catch(e => {
                        console.error('Error:', e);
                        alert('Có lỗi xảy ra trong quá trình cập nhật');
                    });
            });
        </script>
    </th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Chi tiết loại phòng</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/loai-phong}">Loại phòng</a></li>
                    <li class="breadcrumb-item active">Chi tiết</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-info py-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fs-6 fw-bold text-white"><i data-lucide="info" class="me-2"></i> Thông tin
                                loại phòng</h5>
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{'/admin/loai-phong/edit/' + ${id}}" class="btn btn-light">
                                    <i data-lucide="edit" class="me-1"></i> Sửa
                                </a>
                            </div>
                        </div>
                        <div class="card-body p-4">
                            <div id="loadingState" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Đang tải...</span>
                                </div>
                                <p class="mt-2 text-muted">Đang tải chi tiết...</p>
                            </div>

                            <div id="detailContent" style="display:none;">
                                <div class="row mb-3">
                                    <div class="col-sm-4 text-muted">Tên loại phòng:</div>
                                    <div class="col-sm-8 fw-bold" id="tenLoai"></div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-sm-4 text-muted">Mô tả:</div>
                                    <div class="col-sm-8" id="moTa"></div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-sm-4 text-muted">Ngày tạo:</div>
                                    <div class="col-sm-8" id="createdAt"></div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-sm-4 text-muted">Số lượng phòng:</div>
                                    <div class="col-sm-8">
                                        <span class="badge bg-primary rounded-pill" id="soPhong">0</span>
                                    </div>
                                </div>
                                <hr class="my-4">
                                <div class="d-flex gap-2 justify-content-end">
                                    <a th:href="@{/admin/loai-phong}" class="btn btn-secondary px-4">
                                        <i data-lucide="arrow-left" class="me-1"></i> Quay lại
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            const id = /*[[${id}]]*/ 0;

            document.addEventListener('DOMContentLoaded', () => {
                loadData();
                lucide.createIcons();
            });

            function loadData() {
                fetch(`/api/admin/loai-phong/${id}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            const item = data.data;
                            document.getElementById('tenLoai').textContent = item.tenLoai;
                            document.getElementById('moTa').textContent = item.moTa || 'Không có mô tả';
                            document.getElementById('createdAt').textContent = new Date(item.createdAt).toLocaleString('vi-VN');
                            document.getElementById('soPhong').textContent = item.soPhong || 0;

                            document.getElementById('loadingState').style.display = 'none';
                            document.getElementById('detailContent').style.display = 'block';
                        } else {
                            alert('Không tìm thấy thông tin');
                            window.location.href = '/admin/loai-phong';
                        }
                    })
                    .catch(e => console.error('Error:', e));
            }
        </script>
    </th:block>
</body>

</html>

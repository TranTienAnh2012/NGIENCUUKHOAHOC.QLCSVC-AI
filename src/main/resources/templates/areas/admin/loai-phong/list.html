<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Danh sách loại phòng</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1" th:text="${title}">Danh sách loại phòng</h4>
                            <p class="text-muted small mb-0">Quản lý các loại phòng học</p>
                        </div>
                        <a th:href="@{/admin/loai-phong/create}" class="btn btn-primary">
                            <i data-lucide="plus"></i> Thêm loại mới
                        </a>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0" id="dataTable">
                                    <thead class="bg-light">
                                        <tr>
                                            <th class="ps-4">ID</th>
                                            <th>Tên loại</th>
                                            <th>Mô tả</th>
                                            <th class="text-center">Số phòng</th>
                                            <th class="text-end pe-4">Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Data will be loaded via JS -->
                                    </tbody>
                                </table>
                            </div>
                            <div class="p-4">
                                <nav>
                                    <ul class="pagination justify-content-center mb-0" id="pagination"></ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            let currentPage = 0;
            const pageSize = 10;

            document.addEventListener('DOMContentLoaded', () => {
                loadData(0);
                lucide.createIcons();
            });

            function loadData(page) {
                fetch(`/api/admin/loai-phong?page=${page}&size=${pageSize}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            renderTable(data.data.content);
                            renderPagination(data.data);
                            currentPage = page;
                        }
                    })
                    .catch(e => console.error('Error:', e));
            }

            function renderTable(items) {
                const tbody = document.querySelector('#dataTable tbody');
                tbody.innerHTML = '';
                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted">Chưa có dữ liệu</td></tr>';
                    return;
                }
                items.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-4">${item.id}</td>
                            <td class="fw-bold text-primary">${item.tenLoai}</td>
                            <td class="text-muted">${item.moTa || '-'}</td>
                            <td class="text-center">
                                <span class="fw-bold text-dark">
                                    ${item.soPhong || 0}
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group btn-group-sm">
                                    <a href="/admin/loai-phong/view/${item.id}" class="btn btn-outline-info" title="Xem">
                                        <i data-lucide="eye"></i>
                                    </a>
                                    <a href="/admin/loai-phong/edit/${item.id}" class="btn btn-outline-warning" title="Sửa">
                                        <i data-lucide="edit"></i>
                                    </a>
                                    <button class="btn btn-outline-danger" onclick="deleteItem(${item.id})" title="Xóa">
                                        <i data-lucide="trash-2"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                lucide.createIcons();
            }

            function renderPagination(pageData) {
                const pagination = document.getElementById('pagination');
                pagination.innerHTML = '';
                if (pageData.totalPages <= 1) return;

                // Simplified pagination
                for (let i = 0; i < pageData.totalPages; i++) {
                    const active = i === pageData.currentPage ? 'active' : '';
                    pagination.innerHTML += `
                        <li class="page-item ${active}">
                            <a class="page-link" href="#" onclick="loadData(${i});return false;">${i + 1}</a>
                        </li>
                    `;
                }
            }

            function deleteItem(id) {
                if (confirm('Bạn có chắc chắn muốn xóa loại phòng này? Thao tác này có thể ảnh hưởng đến các phòng học liên quan.')) {
                    fetch(`/api/admin/loai-phong/${id}`, { method: 'DELETE' })
                        .then(r => r.json())
                        .then(data => {
                            if (data.success) {
                                alert('Xóa thành công!');
                                loadData(currentPage);
                            } else {
                                alert('Lỗi: ' + (data.message || 'Không thể xóa'));
                            }
                        })
                        .catch(e => {
                            console.error('Error:', e);
                            alert('Có lỗi xảy ra');
                        });
                }
            }
        </script>
        <style>
            .bg-soft-info {
                background-color: rgba(13, 202, 240, 0.1);
            }

            .text-info {
                color: #0dcaf0 !important;
            }
        </style>
    </th:block>
</body>

</html>

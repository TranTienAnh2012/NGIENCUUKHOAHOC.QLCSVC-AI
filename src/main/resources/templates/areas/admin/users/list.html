<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Danh sách người dùng</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1" th:text="${title}">Danh sách người dùng</h4>
                            <p class="text-muted small mb-0">Quản lý tất cả người dùng trong hệ thống</p>
                        </div>
                        <a th:href="@{/admin/users/create}" class="btn btn-primary"><i data-lucide="plus"></i> Thêm
                            người dùng mới</a>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover" id="dataTable">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Họ tên</th>
                                            <th>Email</th>
                                            <th>Số điện thoại</th>
                                            <th>Vai trò</th>
                                            <th>Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                            <nav aria-label="Page navigation">
                                <ul class="pagination justify-content-center" id="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            let currentPage = 0; const pageSize = 10; document.addEventListener('DOMContentLoaded', function () { loadData(0); lucide.createIcons(); });
            function loadData(page) { fetch(`/api/admin/users?page=${page}&size=${pageSize}`).then(r => r.json()).then(data => { if (data.success) { renderTable(data.data.content); renderPagination(data.data); currentPage = page; } }).catch(e => console.error('Error:', e)); }
            function renderTable(items) {
                const tbody = document.querySelector('#dataTable tbody'); tbody.innerHTML = ''; if (items.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Chưa có dữ liệu</td></tr>'; return; }
                items.forEach(item => { const roleBadge = item.vaiTro === 'ADMIN' ? 'bg-danger' : item.vaiTro === 'GIAO_VIEN' ? 'bg-primary' : 'bg-success'; tbody.innerHTML += `<tr><td>${item.id}</td><td>${item.hoTen}</td><td>${item.email}</td><td>${item.soDienThoai || '-'}</td><td><span class="badge ${roleBadge}">${item.vaiTro}</span></td><td><div class="btn-group btn-group-sm"><a href="/admin/users/view/${item.id}" class="btn btn-info" title="Xem"><i data-lucide="eye"></i></a><a href="/admin/users/edit/${item.id}" class="btn btn-warning" title="Sửa"><i data-lucide="edit"></i></a><button class="btn btn-danger" onclick="deleteItem(${item.id})" title="Xóa"><i data-lucide="trash-2"></i></button></div></td></tr>`; }); lucide.createIcons();
            }
            function renderPagination(pageData) { const pagination = document.getElementById('pagination'); pagination.innerHTML = ''; if (pageData.totalPages <= 1) return; for (let i = 0; i < pageData.totalPages; i++) { pagination.innerHTML += `<li class="page-item ${i === pageData.currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="loadData(${i});return false;">${i + 1}</a></li>`; } }
            function deleteItem(id) { if (confirm('Bạn có chắc chắn muốn xóa người dùng này?')) { fetch(`/api/admin/users/${id}`, { method: 'DELETE' }).then(r => r.json()).then(data => { if (data.success) { alert('Xóa thành công!'); loadData(currentPage); } else { alert('Lỗi: ' + (data.message || 'Không thể xóa')); } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); }); } }
        </script>
    </th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Thêm người dùng</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/users}">Người dùng</a></li>
                    <li class="breadcrumb-item active">Thêm mới</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i data-lucide="plus-circle"></i> Thêm người dùng mới</h5>
                        </div>
                        <div class="card-body">
                            <form id="createForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label for="hoTen" class="form-label">Họ tên <span
                                                class="text-danger">*</span></label><input type="text"
                                            class="form-control" id="hoTen" required></div>
                                    <div class="col-md-6 mb-3"><label for="email" class="form-label">Email <span
                                                class="text-danger">*</span></label><input type="email"
                                            class="form-control" id="email" required></div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label for="matKhau" class="form-label">Mật khẩu <span
                                                class="text-danger">*</span></label><input type="password"
                                            class="form-control" id="matKhau" required></div>
                                    <div class="col-md-6 mb-3"><label for="soDienThoai" class="form-label">Số điện
                                            thoại</label><input type="tel" class="form-control" id="soDienThoai"></div>
                                </div>
                                <div class="mb-3"><label for="vaiTro" class="form-label">Vai trò <span
                                            class="text-danger">*</span></label><select class="form-select" id="vaiTro"
                                        required>
                                        <option value="ADMIN">Quản trị viên</option>
                                        <option value="GIAO_VIEN">Giáo viên</option>
                                        <option value="NHAN_VIEN_CSVC">Nhân viên CSVC</option>
                                    </select></div>
                                <div class="d-flex gap-2 justify-content-end"><a th:href="@{/admin/users}"
                                        class="btn btn-secondary"><i data-lucide="x"></i> Hủy</a><button type="submit"
                                        class="btn btn-primary"><i data-lucide="save"></i> Lưu</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
            document.getElementById('createForm').addEventListener('submit', function (e) {
                e.preventDefault(); const form = e.target; if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
                const data = { hoTen: document.getElementById('hoTen').value, email: document.getElementById('email').value, matKhau: document.getElementById('matKhau').value, soDienThoai: document.getElementById('soDienThoai').value, vaiTro: document.getElementById('vaiTro').value };
                fetch('/api/admin/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(r => r.json()).then(data => { if (data.success) { alert('Thêm thành công!'); window.location.href = '/admin/users'; } else { alert('Lỗi: ' + (data.message || 'Không thể thêm')); } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); });
            });
        </script>
    </th:block>
</body>

</html>

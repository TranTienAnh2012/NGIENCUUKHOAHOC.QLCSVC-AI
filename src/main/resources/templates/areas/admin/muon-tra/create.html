<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Tạo phiếu mượn</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/muon-tra}">Mượn trả</a></li>
                    <li class="breadcrumb-item active">Tạo phiếu mới</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i data-lucide="plus-circle"></i> Tạo phiếu mượn mới</h5>
                        </div>
                        <div class="card-body">
                            <form id="createForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label for="nguoiDungId" class="form-label">Người mượn
                                            <span class="text-danger">*</span></label><select class="form-select"
                                            id="nguoiDungId" required>
                                            <option value="">-- Chọn người dùng --</option>
                                        </select></div>
                                    <div class="col-md-6 mb-3"><label for="thietBiId" class="form-label">Thiết bị <span
                                                class="text-danger">*</span></label><select class="form-select"
                                            id="thietBiId" required>
                                            <option value="">-- Chọn thiết bị --</option>
                                        </select></div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label for="ngayMuon" class="form-label">Ngày mượn <span
                                                class="text-danger">*</span></label><input type="date"
                                            class="form-control" id="ngayMuon" required></div>
                                    <div class="col-md-6 mb-3"><label for="ngayTraDuKien" class="form-label">Ngày trả dự
                                            kiến</label><input type="date" class="form-control" id="ngayTraDuKien">
                                    </div>
                                </div>
                                <div class="mb-3"><label for="ghiChu" class="form-label">Ghi chú</label><textarea
                                        class="form-control" id="ghiChu" rows="3"></textarea></div>
                                <div class="d-flex gap-2 justify-content-end"><a th:href="@{/admin/muon-tra}"
                                        class="btn btn-secondary"><i data-lucide="x"></i> Hủy</a><button type="submit"
                                        class="btn btn-primary"><i data-lucide="save"></i> Lưu</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script
            th:inline="javascript">document.addEventListener('DOMContentLoaded', () => { loadUsers(); loadThietBi(); lucide.createIcons(); }); function loadUsers() { fetch('/api/admin/users/all').then(r => r.json()).then(data => { if (data.success) { const select = document.getElementById('nguoiDungId'); data.data.forEach(item => { const option = document.createElement('option'); option.value = item.id; option.textContent = item.hoTen; select.appendChild(option); }); } }); } function loadThietBi() { fetch('/api/admin/thiet-bi/all').then(r => r.json()).then(data => { if (data.success) { const select = document.getElementById('thietBiId'); data.data.forEach(item => { const option = document.createElement('option'); option.value = item.id; option.textContent = item.tenThietBi; select.appendChild(option); }); } }); } document.getElementById('createForm').addEventListener('submit', function (e) {
                    e.preventDefault(); const data = {
                        nguoiMuon: { id: parseInt(document.getElementById('nguoiDungId').value) },
                        thietBi: { id: parseInt(document.getElementById('thietBiId').value) },
                        ngayMuon: document.getElementById('ngayMuon').value,
                        ngayTraDuKien: document.getElementById('ngayTraDuKien').value || null,
                        ghiChu: document.getElementById('ghiChu').value
                    };
                    fetch('/api/admin/muon-tra', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(r => r.json()).then(data => { if (data.success) { alert('Tạo phiếu thành công!'); window.location.href = '/admin/muon-tra'; } else { alert('Lỗi: ' + (data.message || 'Không thể tạo')); } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); });
                });</script>
    </th:block>
</body>

</html>

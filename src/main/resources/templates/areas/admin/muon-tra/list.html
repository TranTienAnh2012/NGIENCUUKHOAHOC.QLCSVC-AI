<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Danh sách mượn trả</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1" th:text="${title}">Danh sách mượn trả</h4>
                            <p class="text-muted small mb-0">Quản lý phiếu mượn trả thiết bị</p>
                        </div><a th:href="@{/admin/muon-tra/create}" class="btn btn-primary"><i data-lucide="plus"></i>
                            Tạo phiếu mượn mới</a>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover" id="dataTable">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Người mượn</th>
                                            <th>Thiết bị</th>
                                            <th>Ngày mượn</th>
                                            <th>Ngày trả</th>
                                            <th>Trạng thái</th>
                                            <th>Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                            <nav>
                                <ul class="pagination justify-content-center" id="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            let currentPage = 0;
            const pageSize = 10;

            // Java có thể serialize LocalDate/LocalDateTime thành array [year, month, day, ...]
            function parseDate(val) {
                if (!val) return null;
                if (Array.isArray(val)) {
                    // [year, month, day] hoặc [year, month, day, hour, minute, second, nano]
                    const [y, m, d] = val;
                    return new Date(y, m - 1, d);
                }
                // Nếu là string ISO
                const d = new Date(val);
                return isNaN(d.getTime()) ? null : d;
            }

            function formatDate(val) {
                const d = parseDate(val);
                if (!d) return '-';
                return d.toLocaleDateString('vi-VN');
            }

            document.addEventListener('DOMContentLoaded', () => {
                loadData(0);
                lucide.createIcons();
            });

            function loadData(page) {
                fetch(`/api/admin/muon-tra?page=${page}&size=${pageSize}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            renderTable(data.data.content);
                            renderPagination(data.data);
                            currentPage = page;
                        }
                    })
                    .catch(e => console.error('Error:', e));
            }

            function renderTable(items) {
                const tbody = document.querySelector('#dataTable tbody');
                tbody.innerHTML = '';

                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Chưa có dữ liệu</td></tr>';
                    return;
                }

                items.forEach(item => {
                    let statusBadge = 'bg-secondary';
                    if (item.trangThai === 'CHO_DUYET') statusBadge = 'bg-warning text-dark';
                    else if (item.trangThai === 'DANG_MUON') statusBadge = 'bg-primary';
                    else if (item.trangThai === 'DA_TRA') statusBadge = 'bg-success';
                    else if (item.trangThai === 'TU_CHOI') statusBadge = 'bg-danger';

                    const ngayTra = item.ngayTraThucTe
                        ? formatDate(item.ngayTraThucTe)
                        : formatDate(item.ngayTraDuKien);

                    // Các nút thao tác mặc định
                    let actionButtons = `
                        <a href="/admin/muon-tra/view/${item.id}" class="btn btn-info" title="Xem chi tiết"><i data-lucide="eye"></i></a>
                        <a href="/admin/muon-tra/edit/${item.id}" class="btn btn-warning" title="Sửa"><i data-lucide="edit"></i></a>
                        <button class="btn btn-danger" onclick="deleteItem(${item.id})" title="Xóa"><i data-lucide="trash-2"></i></button>
                    `;

                    // Nếu trạng thái là CHO_DUYET, thêm nút Duyệt và Từ chối
                    if (item.trangThai === 'CHO_DUYET') {
                        actionButtons = `
                            <button class="btn btn-success" onclick="updateStatus(${item.id}, 'DANG_MUON')" title="Duyệt đơn"><i data-lucide="check-circle"></i></button>
                            <button class="btn btn-secondary" onclick="updateStatus(${item.id}, 'TU_CHOI')" title="Từ chối"><i data-lucide="x-circle"></i></button>
                            ${actionButtons}
                        `;
                    }

                    tbody.innerHTML += `<tr>
                        <td>${item.id}</td>
                        <td>${item.nguoiMuon?.hoTen || '-'}</td>
                        <td>${item.thietBi?.tenThietBi || '-'}</td>
                        <td>${formatDate(item.ngayMuon)}</td>
                        <td>${ngayTra}</td>
                        <td><span class="badge ${statusBadge}">${item.trangThai}</span></td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                ${actionButtons}
                            </div>
                        </td>
                    </tr>`;
                });

                lucide.createIcons();
            }

            function updateStatus(id, newStatus) {
                const actionName = newStatus === 'DANG_MUON' ? 'duyệt' : 'từ chối';
                if (confirm(`Bạn có chắc chắn muốn ${actionName} đơn này?`)) {
                    fetch(`/api/admin/muon-tra/${id}/status?status=${newStatus}`, { method: 'PUT' })
                        .then(r => r.json())
                        .then(data => {
                            if (data.success) {
                                alert(`${actionName.charAt(0).toUpperCase() + actionName.slice(1)} thành công!`);
                                loadData(currentPage);
                            } else {
                                alert(`Lỗi: ` + (data.message || 'Không thể thực hiện thao tác'));
                            }
                        })
                        .catch(e => {
                            console.error('Error:', e);
                            alert('Có lỗi xảy ra');
                        });
                }
            }

            function renderPagination(pageData) {
                const pagination = document.getElementById('pagination');
                pagination.innerHTML = '';
                if (pageData.totalPages <= 1) return;

                for (let i = 0; i < pageData.totalPages; i++) {
                    pagination.innerHTML += `<li class="page-item ${i === pageData.currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="loadData(${i});return false;">${i + 1}</a>
                    </li>`;
                }
            }

            function deleteItem(id) {
                if (confirm('Bạn có chắc chắn muốn xóa?')) {
                    fetch(`/api/admin/muon-tra/${id}`, { method: 'DELETE' })
                        .then(r => r.json())
                        .then(data => {
                            if (data.success) {
                                alert('Xóa thành công!');
                                loadData(currentPage);
                            } else {
                                alert('Lỗi: ' + (data.message || 'Không thể xóa'));
                            }
                        })
                        .catch(e => {
                            console.error('Error:', e);
                            alert('Có lỗi xảy ra');
                        });
                }
            }
        </script>
    </th:block>
</body>

</html>

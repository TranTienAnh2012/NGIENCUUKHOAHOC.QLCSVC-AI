<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title>Nhật ký hội thoại Chatbot</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="h3 mb-0">Nhật ký hội thoại Chatbot</h1>
                    <p class="text-muted mb-0">Lịch sử trò chuyện với AI</p>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover" id="chatbotTable">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Người dùng</th>
                                    <th>Tin nhắn</th>
                                    <th>Phản hồi AI</th>
                                    <th>Ý định (Intent)</th>
                                    <th>Độ tin cậy</th>
                                    <th>Thời gian</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="chatbotData"></tbody>
                        </table>
                    </div>
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center" id="pagination"></ul>
                    </nav>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            let currentPage = 0;
            const pageSize = 10;

            document.addEventListener('DOMContentLoaded', function () {
                loadData(0);
            });

            function loadData(page) {
                currentPage = page;
                fetch(`/api/admin/chatbot/logs?page=${page}&size=${pageSize}`, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                })
                    .then(response => response.json())
                    .then(res => {
                        if (res.success) {
                            renderTable(res.data.content);
                            renderPagination(res.data);
                        }
                    });
            }

            function renderTable(data) {
                const tbody = document.getElementById('chatbotData');
                tbody.innerHTML = '';

                data.forEach(item => {
                    const row = `
                        <tr>
                            <td>${item.id}</td>
                            <td>${item.nguoiDung ? item.nguoiDung.hoTen : 'Khách'}</td>
                            <td style="max-width: 200px;" class="text-truncate" title="${item.tinNhan}">${item.tinNhan}</td>
                            <td style="max-width: 250px;" class="text-truncate" title="${item.phanHoi}">${item.phanHoi}</td>
                            <td><span class="badge bg-primary">${item.intent || 'Unknown'}</span></td>
                            <td>${item.doTinCay ? (item.doTinCay * 100).toFixed(1) + '%' : 'N/A'}</td>
                            <td>${new Date(item.createdAt).toLocaleString('vi-VN')}</td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            }

            function renderPagination(pageData) {
                const pagination = document.getElementById('pagination');
                pagination.innerHTML = '';
                for (let i = 0; i < pageData.totalPages; i++) {
                    pagination.innerHTML += `
                        <li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="javascript:void(0)" onclick="loadData(${i})">${i + 1}</a>
                        </li>
                    `;
                }
            }

            function deleteItem(id) {
                if (confirm('Xóa bản ghi này?')) {
                    fetch(`/api/admin/chatbot/logs/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                    })
                        .then(response => response.json())
                        .then(res => {
                            if (res.success) loadData(currentPage);
                        });
                }
            }
        </script>
    </div>
</body>

</html>

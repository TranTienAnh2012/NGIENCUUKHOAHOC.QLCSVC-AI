<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Sửa thiết bị</title>
    <style>
        .img-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .img-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
        }

        .img-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
        }

        .img-card .img-placeholder {
            width: 100%;
            height: 150px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bbb;
        }

        .img-card .badge-loai {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 0.7rem;
        }

        .img-card .btn-delete-img {
            position: absolute;
            top: 6px;
            right: 6px;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .img-card:hover .btn-delete-img {
            opacity: 1;
        }

        .upload-zone {
            border: 2px dashed #c0c0c0;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            background: #fafafa;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            background: #e8f4ff;
            border-color: #0d6efd;
        }

        .upload-zone input[type="file"] {
            display: none;
        }

        /* Lightbox */
        #imgLightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #imgLightbox.active {
            display: flex;
        }

        #imgLightbox img {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        #imgLightbox .close-lb {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            line-height: 1;
        }

        #imgLightbox .lb-info {
            color: #fff;
            margin-top: 14px;
            text-align: center;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/thiet-bi}">Thiết bị</a></li>
                    <li class="breadcrumb-item active">Sửa</li>
                </ol>
            </nav>

            <!-- Form Card -->
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-warning text-dark">
                            <h5 class="mb-0"><i data-lucide="edit"></i> Sửa thông tin thiết bị</h5>
                        </div>
                        <div class="card-body">
                            <!-- Loading State -->
                            <div id="loadingState" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Đang tải...</span>
                                </div>
                                <p class="mt-2 text-muted">Đang tải dữ liệu...</p>
                            </div>

                            <!-- Form -->
                            <form id="editForm" style="display: none;">
                                <input type="hidden" id="thietBiId" th:value="${id}">

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="tenThietBi" class="form-label">Tên thiết bị <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="tenThietBi" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="maThietBi" class="form-label">Mã thiết bị <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="maThietBi" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="loaiThietBiId" class="form-label">Loại thiết bị <span
                                                class="text-danger">*</span></label>
                                        <select class="form-select" id="loaiThietBiId" required>
                                            <option value="">-- Chọn loại --</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="phongId" class="form-label">Phòng học</label>
                                        <select class="form-select" id="phongId">
                                            <option value="">-- Chọn phòng --</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="trangThai" class="form-label">Trạng thái</label>
                                        <select class="form-select" id="trangThai">
                                            <option value="TOT">Tốt</option>
                                            <option value="BAO_TRI">Bảo trì</option>
                                            <option value="HONG">Hỏng</option>
                                            <option value="THANH_LY">Thanh lý</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="ngayMua" class="form-label">Ngày mua</label>
                                        <input type="date" class="form-control" id="ngayMua">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="ghiChu" class="form-label">Ghi chú</label>
                                    <textarea class="form-control" id="ghiChu" rows="3"></textarea>
                                </div>

                                <div class="d-flex gap-2 justify-content-end">
                                    <a th:href="@{/admin/thiet-bi}" class="btn btn-secondary">
                                        <i data-lucide="x"></i> Hủy
                                    </a>
                                    <button type="submit" class="btn btn-warning text-dark">
                                        <i data-lucide="save"></i> Cập nhật
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- ============ SECTION HÌNH ẢNH ============ -->
                    <div class="card shadow-sm" id="hinhAnhSection" style="display:none;">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i data-lucide="image"></i> Hình ảnh thiết bị</h5>
                            <span class="badge bg-secondary" id="imgCount">0 ảnh</span>
                        </div>
                        <div class="card-body">

                            <!-- Grid ảnh hiện có -->
                            <div class="row g-3 mb-4" id="imgGrid">
                                <div class="col-12 text-center text-muted py-3" id="noImgMsg">
                                    <i data-lucide="image-off" style="width:40px;height:40px;"></i>
                                    <p class="mt-2 mb-0">Chưa có hình ảnh nào</p>
                                </div>
                            </div>

                            <hr>

                            <!-- Upload ảnh mới -->
                            <h6 class="fw-semibold mb-3"><i data-lucide="upload"></i> Thêm ảnh mới</h6>
                            <div class="row g-3 align-items-end">
                                <div class="col-md-4">
                                    <label class="form-label small">Loại hình ảnh</label>
                                    <select class="form-select form-select-sm" id="uploadLoai">
                                        <option value="HINH_ANH_CHINH">📷 Ảnh chính</option>
                                        <option value="QR_CODE">🔲 QR Code</option>
                                        <option value="KIEM_TRA_TINH_TRANG">🔍 Kiểm tra tình trạng</option>
                                    </select>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label small">Chọn file ảnh</label>
                                    <div class="upload-zone" id="uploadZone"
                                        onclick="document.getElementById('uploadFileInput').click()">
                                        <i data-lucide="upload-cloud" style="width:32px;height:32px;color:#6c757d;"></i>
                                        <p class="mb-0 mt-2 text-muted small">Bấm để chọn ảnh hoặc kéo thả vào đây</p>
                                        <p class="mb-0 text-muted" style="font-size:0.75rem;">PNG, JPG, WEBP tối đa 5MB
                                        </p>
                                        <input type="file" id="uploadFileInput" accept="image/*">
                                    </div>
                                    <!-- Preview + nút upload -->
                                    <div id="uploadPreviewArea" style="display:none;" class="mt-2">
                                        <div class="d-flex align-items-center gap-3 p-2 border rounded">
                                            <img id="uploadPreviewImg" src="" alt="preview"
                                                style="width:60px;height:60px;object-fit:cover;border-radius:6px;">
                                            <div class="flex-grow-1">
                                                <div id="uploadFileName" class="small fw-semibold text-truncate"></div>
                                                <div id="uploadFileSize" class="small text-muted"></div>
                                            </div>
                                            <button class="btn btn-sm btn-secondary" onclick="clearUpload()">
                                                <i data-lucide="x"></i>
                                            </button>
                                            <button class="btn btn-sm btn-primary" id="btnDoUpload"
                                                onclick="doUpload()">
                                                <i data-lucide="upload"></i> Upload
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    <!-- ============ END HÌNH ẢNH ============ -->
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="imgLightbox" onclick="closeLightbox()">
        <span class="close-lb">&times;</span>
        <img id="lbImg" src="" alt="">
        <div class="lb-info" id="lbInfo"></div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            const id = /*[[${id}]]*/ 0;

            document.addEventListener('DOMContentLoaded', function () {
                loadLoaiThietBi();
                loadPhongHoc();
                loadThietBiData();
                setupDragDrop();
                document.getElementById('uploadFileInput').addEventListener('change', onFileSelected);
                lucide.createIcons();
            });

            function loadLoaiThietBi() {
                fetch('/api/admin/loai-thiet-bi/all')
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            const select = document.getElementById('loaiThietBiId');
                            data.data.forEach(item => {
                                const opt = document.createElement('option');
                                opt.value = item.id;
                                opt.textContent = item.tenLoai;
                                select.appendChild(opt);
                            });
                        }
                    });
            }

            function loadPhongHoc() {
                fetch('/api/admin/phong-hoc/all')
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            const select = document.getElementById('phongId');
                            data.data.forEach(item => {
                                const opt = document.createElement('option');
                                opt.value = item.id;
                                opt.textContent = item.tenPhong;
                                select.appendChild(opt);
                            });
                        }
                    });
            }

            function loadThietBiData() {
                fetch(`/api/admin/thiet-bi/${id}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            const item = data.data;
                            document.getElementById('tenThietBi').value = item.tenThietBi;
                            document.getElementById('maThietBi').value = item.maThietBi;
                            document.getElementById('loaiThietBiId').value = item.loaiThietBi?.id || '';
                            document.getElementById('phongId').value = item.phong?.id || '';
                            document.getElementById('trangThai').value = item.trangThai;
                            document.getElementById('ngayMua').value = item.ngayMua || '';
                            document.getElementById('ghiChu').value = item.ghiChu || '';

                            document.getElementById('loadingState').style.display = 'none';
                            document.getElementById('editForm').style.display = 'block';
                            document.getElementById('hinhAnhSection').style.display = 'block';
                            lucide.createIcons();

                            // Load ảnh
                            loadImages();
                        } else {
                            alert('Không tìm thấy thiết bị');
                            window.location.href = '/admin/thiet-bi';
                        }
                    })
                    .catch(() => {
                        alert('Có lỗi xảy ra khi tải dữ liệu');
                    });
            }

            // ========== HÌNH ẢNH ==========

            function loadImages() {
                fetch(`/api/admin/hinh-anh/thiet-bi/${id}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) renderImages(data.data);
                    })
                    .catch(err => console.error('Error loading images:', err));
            }

            const loaiBadge = {
                'QR_CODE': { cls: 'bg-info text-dark', label: '🔲 QR Code' },
                'HINH_ANH_CHINH': { cls: 'bg-success', label: '📷 Ảnh chính' },
                'KIEM_TRA_TINH_TRANG': { cls: 'bg-warning text-dark', label: '🔍 Kiểm tra' }
            };

            function renderImages(items) {
                const grid = document.getElementById('imgGrid');
                const noMsg = document.getElementById('noImgMsg');
                document.getElementById('imgCount').textContent = items.length + ' ảnh';

                // Xóa card cũ (giữ lại noImgMsg)
                Array.from(grid.children).forEach(c => { if (c.id !== 'noImgMsg') c.remove(); });

                if (items.length === 0) {
                    noMsg.style.display = 'block';
                    lucide.createIcons();
                    return;
                }
                noMsg.style.display = 'none';

                items.forEach(item => {
                    const badge = loaiBadge[item.loaiHinhAnh] || { cls: 'bg-secondary', label: item.loaiHinhAnh || 'Chưa phân loại' };
                    const ngay = item.ngayChup ? new Date(item.ngayChup).toLocaleDateString('vi-VN') : '';

                    const col = document.createElement('div');
                    col.className = 'col-6 col-md-4 col-lg-3';
                    col.innerHTML = `
                        <div class="img-card">
                            <span class="badge ${badge.cls} badge-loai">${badge.label}</span>
                            <button class="btn btn-danger btn-sm btn-delete-img" title="Xóa ảnh"
                                onclick="deleteImage(${item.id}, this)">
                                <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
                            </button>
                            <img src="${item.urlHinhAnh}" alt="${item.loaiHinhAnh || ''}"
                                onclick="openLightbox('${item.urlHinhAnh}', '${badge.label}', '${ngay}')"
                                onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                            <div class="img-placeholder" style="display:none;">
                                <span style="font-size:2rem;">🖼️</span>
                            </div>
                            <div class="p-2 small text-muted" style="font-size:0.72rem;">${ngay}</div>
                        </div>
                    `;
                    grid.appendChild(col);
                });
                lucide.createIcons();
            }

            function deleteImage(imgId, btn) {
                if (!confirm('Xóa hình ảnh này?')) return;
                btn.disabled = true;
                fetch(`/api/admin/hinh-anh/${imgId}`, { method: 'DELETE' })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            loadImages();
                        } else {
                            alert('Lỗi: ' + (data.message || 'Không thể xóa'));
                            btn.disabled = false;
                        }
                    })
                    .catch(() => { alert('Lỗi kết nối'); btn.disabled = false; });
            }

            // ========== UPLOAD ==========

            function setupDragDrop() {
                const zone = document.getElementById('uploadZone');
                zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
                zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
                zone.addEventListener('drop', e => {
                    e.preventDefault();
                    zone.classList.remove('dragover');
                    const file = e.dataTransfer.files[0];
                    if (file) handleFile(file);
                });
            }

            function onFileSelected(e) {
                const file = e.target.files[0];
                if (file) handleFile(file);
            }

            function handleFile(file) {
                if (!file.type.startsWith('image/')) { alert('Vui lòng chọn file ảnh!'); return; }
                if (file.size > 5 * 1024 * 1024) { alert('File quá lớn! Tối đa 5MB.'); return; }

                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('uploadPreviewImg').src = e.target.result;
                    document.getElementById('uploadFileName').textContent = file.name;
                    document.getElementById('uploadFileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
                    document.getElementById('uploadPreviewArea').style.display = 'block';
                    document.getElementById('uploadZone').style.display = 'none';
                    // lưu file vào element để dùng khi upload
                    document.getElementById('uploadFileInput')._selectedFile = file;
                    lucide.createIcons();
                };
                reader.readAsDataURL(file);
            }

            function clearUpload() {
                document.getElementById('uploadPreviewArea').style.display = 'none';
                document.getElementById('uploadZone').style.display = 'block';
                document.getElementById('uploadFileInput').value = '';
                document.getElementById('uploadFileInput')._selectedFile = null;
                lucide.createIcons();
            }

            function doUpload() {
                const file = document.getElementById('uploadFileInput')._selectedFile;
                if (!file) { alert('Chưa chọn file!'); return; }

                const loai = document.getElementById('uploadLoai').value;
                const formData = new FormData();
                formData.append('file', file);
                formData.append('loaiHinhAnh', loai);

                const btn = document.getElementById('btnDoUpload');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang upload...';

                fetch(`/api/admin/hinh-anh/upload/${id}`, {
                    method: 'POST',
                    body: formData
                })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            clearUpload();
                            loadImages();
                        } else {
                            alert('Lỗi: ' + (data.message || 'Không thể upload'));
                        }
                    })
                    .catch(() => alert('Lỗi kết nối khi upload'))
                    .finally(() => {
                        btn.disabled = false;
                        btn.innerHTML = '<i data-lucide="upload"></i> Upload';
                        lucide.createIcons();
                    });
            }

            // ========== LIGHTBOX ==========

            function openLightbox(url, loai, ngay) {
                document.getElementById('lbImg').src = url;
                document.getElementById('lbInfo').textContent = loai + (ngay ? '  ·  ' + ngay : '');
                document.getElementById('imgLightbox').classList.add('active');
            }

            function closeLightbox() {
                document.getElementById('imgLightbox').classList.remove('active');
            }

            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

            // ========== SUBMIT FORM ==========

            document.getElementById('editForm').addEventListener('submit', function (e) {
                e.preventDefault();

                const data = {
                    tenThietBi: document.getElementById('tenThietBi').value,
                    maThietBi: document.getElementById('maThietBi').value,
                    trangThai: document.getElementById('trangThai').value,
                    ngayMua: document.getElementById('ngayMua').value || null,
                    ghiChu: document.getElementById('ghiChu').value
                };

                const loaiId = document.getElementById('loaiThietBiId').value;
                if (loaiId) data.loaiThietBi = { id: parseInt(loaiId) };

                const phongId = document.getElementById('phongId').value;
                if (phongId) data.phong = { id: parseInt(phongId) };

                fetch(`/api/admin/thiet-bi/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            alert('Cập nhật thành công!');
                            window.location.href = '/admin/thiet-bi';
                        } else {
                            alert('Lỗi: ' + (data.message || 'Không thể cập nhật'));
                        }
                    })
                    .catch(() => alert('Có lỗi xảy ra khi cập nhật'));
            });
        </script>
    </th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Danh sách phòng học</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1" th:text="${title}">Danh sách phòng học</h4>
                            <p class="text-muted small mb-0">Quản lý tất cả phòng học</p>
                        </div><a th:href="@{/admin/phong-hoc/create}" class="btn btn-primary"><i data-lucide="plus"></i>
                            Thêm phòng học mới</a>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover" id="dataTable">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Tên phòng</th>
                                            <th>Loại phòng</th>
                                            <th>Tòa nhà</th>
                                            <th>Tầng</th>
                                            <th>Sức chứa</th>
                                            <th>Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                            <nav>
                                <ul class="pagination justify-content-center" id="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            let currentPage = 0;
            const pageSize = 10;
            document.addEventListener('DOMContentLoaded', () => {
                loadData(0);
                lucide.createIcons();
            });

            function loadData(page) {
                fetch(`/api/admin/phong-hoc?page=${page}&size=${pageSize}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            renderTable(data.data.content);
                            renderPagination(data.data);
                            currentPage = page;
                        } else {
                            alert('Lỗi: ' + (data.message || 'Không thể tải dữ liệu'));
                        }
                    })
                    .catch(e => {
                        console.error('Error:', e);
                        alert('Có lỗi xảy ra khi gọi API');
                    });
            }

            function renderTable(items) {
                const tbody = document.querySelector('#dataTable tbody');
                tbody.innerHTML = '';
                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Chưa có dữ liệu</td></tr>';
                    return;
                }
                items.forEach(item => {
                    const loaiPhong = item.loaiPhong ? item.loaiPhong.tenLoai : '-';
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.id}</td>
                            <td>${item.tenPhong}</td>
                            <td><span class="badge bg-secondary">${loaiPhong}</span></td>
                            <td>${item.toaNha || '-'}</td>
                            <td>${item.tang || '-'}</td>
                            <td>${item.sucChua || '-'}</td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a href="/admin/phong-hoc/view/${item.id}" class="btn btn-info"><i data-lucide="eye"></i></a>
                                    <a href="/admin/phong-hoc/edit/${item.id}" class="btn btn-warning"><i data-lucide="edit"></i></a>
                                    <button class="btn btn-danger" onclick="deleteItem(${item.id})"><i data-lucide="trash-2"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                lucide.createIcons();
            }
            function renderPagination(pageData) { const pagination = document.getElementById('pagination'); pagination.innerHTML = ''; if (pageData.totalPages <= 1) return; for (let i = 0; i < pageData.totalPages; i++) { pagination.innerHTML += `<li class="page-item ${i === pageData.currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="loadData(${i});return false;">${i + 1}</a></li>`; } } function deleteItem(id) { if (confirm('Bạn có chắc chắn muốn xóa?')) { fetch(`/api/admin/phong-hoc/${id}`, { method: 'DELETE' }).then(r => r.json()).then(data => { if (data.success) { alert('Xóa thành công!'); loadData(currentPage); } else { alert('Lỗi: ' + (data.message || 'Không thể xóa')); } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); }); } }</script>
    </th:block>
</body>

</html>

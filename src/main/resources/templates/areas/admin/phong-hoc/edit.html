<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Sửa phòng học</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/phong-hoc}">Phòng học</a></li>
                    <li class="breadcrumb-item active">Sửa</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm">
                        <div class="card-header bg-warning text-dark">
                            <h5 class="mb-0"><i data-lucide="edit"></i> Sửa thông tin phòng học</h5>
                        </div>
                        <div class="card-body">
                            <div id="loadingState" class="text-center py-5">
                                <div class="spinner-border text-primary"></div>
                                <p class="mt-2 text-muted">Đang tải...</p>
                            </div>
                            <form id="editForm" style="display:none;">
                                <input type="hidden" id="itemId" th:value="${id}">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="tenPhong" class="form-label">Tên phòng <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="tenPhong" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="maPhong" class="form-label">Mã phòng <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="maPhong" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="toaNha" class="form-label">Tòa nhà</label>
                                        <input type="text" class="form-control" id="toaNha">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="tang" class="form-label">Tầng</label>
                                        <input type="number" class="form-control" id="tang" min="0">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="sucChua" class="form-label">Sức chứa</label>
                                        <input type="number" class="form-control" id="sucChua" min="0">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="loaiPhong" class="form-label">Loại phòng <span
                                                class="text-danger">*</span></label>
                                        <select class="form-select" id="loaiPhong" required>
                                            <option value="">-- Chọn loại phòng --</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="d-flex gap-2 justify-content-end">
                                    <a th:href="@{/admin/phong-hoc}" class="btn btn-secondary">
                                        <i data-lucide="x"></i> Hủy
                                    </a>
                                    <button type="submit" class="btn btn-warning text-dark">
                                        <i data-lucide="save"></i> Cập nhật
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            const id = /*[[${id}]]*/ 0;
            document.addEventListener('DOMContentLoaded', () => {
                init();
                lucide.createIcons();
            });

            async function init() {
                await loadLoaiPhong();
                await loadData();
            }

            async function loadLoaiPhong() {
                try {
                    const r = await fetch('/api/admin/loai-phong/all');
                    const data = await r.json();
                    if (data.success) {
                        const select = document.getElementById('loaiPhong');
                        data.data.forEach(item => {
                            const option = document.createElement('option');
                            option.value = item.id;
                            option.textContent = item.tenLoai;
                            select.appendChild(option);
                        });
                    }
                } catch (e) {
                    console.error('Error loading LoaiPhong:', e);
                }
            }

            async function loadData() {
                try {
                    const r = await fetch(`/api/admin/phong-hoc/${id}`);
                    const data = await r.json();
                    if (data.success) {
                        const item = data.data;
                        document.getElementById('tenPhong').value = item.tenPhong;
                        document.getElementById('maPhong').value = item.maPhong;
                        document.getElementById('toaNha').value = item.toaNha || '';
                        document.getElementById('tang').value = item.tang || '';
                        document.getElementById('sucChua').value = item.sucChua || '';
                        if (item.loaiPhong) {
                            document.getElementById('loaiPhong').value = item.loaiPhong.id;
                        }
                        document.getElementById('loadingState').style.display = 'none';
                        document.getElementById('editForm').style.display = 'block';
                    } else {
                        alert('Không tìm thấy');
                        window.location.href = '/admin/phong-hoc';
                    }
                } catch (e) {
                    console.error('Error:', e);
                    alert('Có lỗi xảy ra');
                }
            }

            document.getElementById('editForm').addEventListener('submit', function (e) {
                e.preventDefault();
                const data = {
                    tenPhong: document.getElementById('tenPhong').value,
                    maPhong: document.getElementById('maPhong').value,
                    toaNha: document.getElementById('toaNha').value || null,
                    tang: document.getElementById('tang').value ? parseInt(document.getElementById('tang').value) : null,
                    sucChua: document.getElementById('sucChua').value ? parseInt(document.getElementById('sucChua').value) : null,
                    loaiPhong: { id: parseInt(document.getElementById('loaiPhong').value) }
                };
                fetch(`/api/admin/phong-hoc/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            alert('Cập nhật thành công!');
                            window.location.href = '/admin/phong-hoc';
                        } else {
                            alert('Lỗi: ' + (data.message || 'Không thể cập nhật'));
                        }
                    })
                    .catch(e => {
                        console.error('Error:', e);
                        alert('Có lỗi xảy ra');
                    });
            });
        </script>
    </th:block>
</body>

</html>

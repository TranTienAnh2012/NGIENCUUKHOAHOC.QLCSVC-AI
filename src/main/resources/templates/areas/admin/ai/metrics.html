<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title>Chỉ số Model AI</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="h3 mb-0">Chỉ số Model AI</h1>
                    <p class="text-muted mb-0">Hiệu suất mô hình AI</p>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover" id="metricsTable">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Tên Model</th>
                                    <th>Phiên bản</th>
                                    <th>Loại Metric</th>
                                    <th>Giá trị</th>
                                    <th>Ngày đánh giá</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="metricsData"></tbody>
                        </table>
                    </div>
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center" id="pagination"></ul>
                    </nav>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            let currentPage = 0;
            const pageSize = 10;

            document.addEventListener('DOMContentLoaded', function () {
                loadData(0);
            });

            function loadData(page) {
                currentPage = page;
                fetch(`/api/admin/ai/metrics?page=${page}&size=${pageSize}`, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                })
                    .then(response => response.json())
                    .then(res => {
                        if (res.success) {
                            renderTable(res.data.content);
                            renderPagination(res.data);
                        }
                    });
            }

            function renderTable(data) {
                const tbody = document.getElementById('metricsData');
                tbody.innerHTML = '';

                data.forEach(item => {
                    const row = `
                        <tr>
                            <td>${item.id}</td>
                            <td><strong>${item.tenModel}</strong></td>
                            <td><span class="badge bg-info">${item.phienBan}</span></td>
                            <td>${item.loaiMetric}</td>
                            <td class="fw-bold">${(item.giaTri * 100).toFixed(2)}%</td>
                            <td>${new Date(item.ngayDanhGia).toLocaleDateString('vi-VN')}</td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            }

            function renderPagination(pageData) {
                const pagination = document.getElementById('pagination');
                pagination.innerHTML = '';
                for (let i = 0; i < pageData.totalPages; i++) {
                    pagination.innerHTML += `
                        <li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="javascript:void(0)" onclick="loadData(${i})">${i + 1}</a>
                        </li>
                    `;
                }
            }

            function deleteItem(id) {
                if (confirm('Xóa chỉ số này?')) {
                    fetch(`/api/admin/ai/metrics/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                    })
                        .then(response => response.json())
                        .then(res => {
                            if (res.success) loadData(currentPage);
                        });
                }
            }
        </script>
    </div>
</body>

</html>

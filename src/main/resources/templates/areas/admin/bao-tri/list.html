<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Danh sách bảo trì</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1" th:text="${title}">Danh sách bảo trì</h4>
                            <p class="text-muted small mb-0">Quản lý phiếu bảo trì thiết bị</p>
                        </div><a th:href="@{/admin/bao-tri/create}" class="btn btn-primary"><i data-lucide="plus"></i>
                            Tạo phiếu bảo trì mới</a>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover" id="dataTable">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Thiết bị</th>
                                            <th>Ngày bảo trì</th>
                                            <th>Loại bảo trì</th>
                                            <th>Người thực hiện</th>
                                            <th>Chi phí</th>
                                            <th>Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                            <nav>
                                <ul class="pagination justify-content-center" id="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script
            th:inline="javascript">let currentPage = 0; const pageSize = 10; document.addEventListener('DOMContentLoaded', () => { loadData(0); lucide.createIcons(); }); function loadData(page) { fetch(`/api/admin/bao-tri?page=${page}&size=${pageSize}`).then(r => r.json()).then(data => { if (data.success) { renderTable(data.data.content); renderPagination(data.data); currentPage = page; } }).catch(e => console.error('Error:', e)); } function renderTable(items) { const tbody = document.querySelector('#dataTable tbody'); tbody.innerHTML = ''; if (items.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Chưa có dữ liệu</td></tr>'; return; } items.forEach(item => { tbody.innerHTML += `<tr><td>${item.id}</td><td>${item.thietBi?.tenThietBi || '-'}</td><td>${new Date(item.ngayBaoTri).toLocaleDateString('vi-VN')}</td><td>${item.loaiBaoTri || '-'}</td><td>${item.nguoiThucHien || '-'}</td><td>${item.chiPhi ? item.chiPhi.toLocaleString('vi-VN') + 'đ' : '-'}</td><td><div class="btn-group btn-group-sm"><a href="/admin/bao-tri/view/${item.id}" class="btn btn-info"><i data-lucide="eye"></i></a><a href="/admin/bao-tri/edit/${item.id}" class="btn btn-warning"><i data-lucide="edit"></i></a><button class="btn btn-danger" onclick="deleteItem(${item.id})"><i data-lucide="trash-2"></i></button></div></td></tr>`; }); lucide.createIcons(); } function renderPagination(pageData) { const pagination = document.getElementById('pagination'); pagination.innerHTML = ''; if (pageData.totalPages <= 1) return; for (let i = 0; i < pageData.totalPages; i++) { pagination.innerHTML += `<li class="page-item ${i === pageData.currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="loadData(${i});return false;">${i + 1}</a></li>`; } } function deleteItem(id) { if (confirm('Bạn có chắc chắn muốn xóa?')) { fetch(`/api/admin/bao-tri/${id}`, { method: 'DELETE' }).then(r => r.json()).then(data => { if (data.success) { alert('Xóa thành công!'); loadData(currentPage); } else { alert('Lỗi: ' + (data.message || 'Không thể xóa')); } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); }); } }</script>
    </th:block>
</body>

</html>

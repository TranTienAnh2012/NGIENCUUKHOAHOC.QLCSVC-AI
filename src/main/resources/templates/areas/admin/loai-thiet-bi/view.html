<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Chi tiết loại thiết bị</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/loai-thiet-bi}">Loại thiết bị</a></li>
                    <li class="breadcrumb-item active">Chi tiết</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm">
                        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i data-lucide="eye"></i> Thông tin chi tiết</h5>
                            <div class="btn-group"><a th:href="@{/admin/loai-thiet-bi/edit/{id}(id=${id})}"
                                    class="btn btn-sm btn-warning"><i data-lucide="edit"></i> Sửa</a><button
                                    class="btn btn-sm btn-danger" onclick="deleteItem()"><i data-lucide="trash-2"></i>
                                    Xóa</button></div>
                        </div>
                        <div class="card-body">
                            <div id="loadingState" class="text-center py-5">
                                <div class="spinner-border text-primary"></div>
                                <p class="mt-2 text-muted">Đang tải...</p>
                            </div>
                            <div id="dataDisplay" style="display:none;">
                                <dl class="row mb-0">
                                    <dt class="col-sm-4 text-muted">ID</dt>
                                    <dd class="col-sm-8" id="display-id">-</dd>
                                    <dt class="col-sm-4 text-muted">Tên loại</dt>
                                    <dd class="col-sm-8 fw-bold" id="display-tenLoai">-</dd>
                                    <dt class="col-sm-4 text-muted">Mô tả</dt>
                                    <dd class="col-sm-8" id="display-moTa">-</dd>
                                    <dt class="col-sm-4 text-muted">Số thiết bị</dt>
                                    <dd class="col-sm-8" id="display-soThietBi">-</dd>
                                </dl>
                            </div>
                        </div>
                        <div class="card-footer bg-light"><a th:href="@{/admin/loai-thiet-bi}"
                                class="btn btn-secondary"><i data-lucide="arrow-left"></i> Quay lại</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script
            th:inline="javascript">const id =/*[[${id}]]*/0; document.addEventListener('DOMContentLoaded', () => { loadData(); lucide.createIcons(); }); function loadData() { fetch(`/api/admin/loai-thiet-bi/${id}`).then(r => r.json()).then(data => { if (data.success) { const item = data.data; document.getElementById('display-id').textContent = item.id; document.getElementById('display-tenLoai').textContent = item.tenLoai; document.getElementById('display-moTa').textContent = item.moTa || 'Không có mô tả'; document.getElementById('display-soThietBi').innerHTML = `<span class="badge bg-info">${item.soThietBi || 0}</span>`; document.getElementById('loadingState').style.display = 'none'; document.getElementById('dataDisplay').style.display = 'block'; lucide.createIcons(); } else { alert('Không tìm thấy'); window.location.href = '/admin/loai-thiet-bi'; } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); }); } function deleteItem() { if (confirm('Bạn có chắc chắn muốn xóa?')) { fetch(`/api/admin/loai-thiet-bi/${id}`, { method: 'DELETE' }).then(r => r.json()).then(data => { if (data.success) { alert('Xóa thành công!'); window.location.href = '/admin/loai-thiet-bi'; } else { alert('Lỗi: ' + (data.message || 'Không thể xóa')); } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); }); } }</script>
    </th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Thêm loại thiết bị</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/loai-thiet-bi}">Loại thiết bị</a></li>
                    <li class="breadcrumb-item active">Thêm mới</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i data-lucide="plus-circle"></i> Thêm loại thiết bị mới</h5>
                        </div>
                        <div class="card-body">
                            <form id="createForm">
                                <div class="mb-3"><label for="tenLoai" class="form-label">Tên loại <span
                                            class="text-danger">*</span></label><input type="text" class="form-control"
                                        id="tenLoai" required></div>
                                <div class="mb-3"><label for="moTa" class="form-label">Mô tả</label><textarea
                                        class="form-control" id="moTa" rows="4"></textarea></div>
                                <div class="d-flex gap-2 justify-content-end"><a th:href="@{/admin/loai-thiet-bi}"
                                        class="btn btn-secondary"><i data-lucide="x"></i> Hủy</a><button type="submit"
                                        class="btn btn-primary"><i data-lucide="save"></i> Lưu</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script
            th:inline="javascript">document.addEventListener('DOMContentLoaded', () => lucide.createIcons()); document.getElementById('createForm').addEventListener('submit', function (e) { e.preventDefault(); const data = { tenLoai: document.getElementById('tenLoai').value, moTa: document.getElementById('moTa').value }; fetch('/api/admin/loai-thiet-bi', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(r => r.json()).then(data => { if (data.success) { alert('Thêm thành công!'); window.location.href = '/admin/loai-thiet-bi'; } else { alert('Lỗi: ' + (data.message || 'Không thể thêm')); } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); }); });</script>
    </th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Sửa loại thiết bị</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/loai-thiet-bi}">Loại thiết bị</a></li>
                    <li class="breadcrumb-item active">Sửa</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm">
                        <div class="card-header bg-warning text-dark">
                            <h5 class="mb-0"><i data-lucide="edit"></i> Sửa thông tin loại thiết bị</h5>
                        </div>
                        <div class="card-body">
                            <div id="loadingState" class="text-center py-5">
                                <div class="spinner-border text-primary"></div>
                                <p class="mt-2 text-muted">Đang tải...</p>
                            </div>
                            <form id="editForm" style="display:none;"><input type="hidden" id="itemId" th:value="${id}">
                                <div class="mb-3"><label for="tenLoai" class="form-label">Tên loại <span
                                            class="text-danger">*</span></label><input type="text" class="form-control"
                                        id="tenLoai" required></div>
                                <div class="mb-3"><label for="moTa" class="form-label">Mô tả</label><textarea
                                        class="form-control" id="moTa" rows="4"></textarea></div>
                                <div class="d-flex gap-2 justify-content-end"><a th:href="@{/admin/loai-thiet-bi}"
                                        class="btn btn-secondary"><i data-lucide="x"></i> Hủy</a><button type="submit"
                                        class="btn btn-warning text-dark"><i data-lucide="save"></i> Cập nhật</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script
            th:inline="javascript">const id =/*[[${id}]]*/0; document.addEventListener('DOMContentLoaded', () => { loadData(); lucide.createIcons(); }); function loadData() { fetch(`/api/admin/loai-thiet-bi/${id}`).then(r => r.json()).then(data => { if (data.success) { const item = data.data; document.getElementById('tenLoai').value = item.tenLoai; document.getElementById('moTa').value = item.moTa || ''; document.getElementById('loadingState').style.display = 'none'; document.getElementById('editForm').style.display = 'block'; } else { alert('Không tìm thấy'); window.location.href = '/admin/loai-thiet-bi'; } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); }); } document.getElementById('editForm').addEventListener('submit', function (e) { e.preventDefault(); const data = { tenLoai: document.getElementById('tenLoai').value, moTa: document.getElementById('moTa').value }; fetch(`/api/admin/loai-thiet-bi/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(r => r.json()).then(data => { if (data.success) { alert('Cập nhật thành công!'); window.location.href = '/admin/loai-thiet-bi'; } else { alert('Lỗi: ' + (data.message || 'Không thể cập nhật')); } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); }); });</script>
    </th:block>
</body>

</html>

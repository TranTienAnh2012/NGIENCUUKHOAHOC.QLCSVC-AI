<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Danh sách báo hỏng</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1" th:text="${title}">Danh sách báo hỏng</h4>
                            <p class="text-muted small mb-0">Quản lý phiếu báo hỏng thiết bị</p>
                        </div><a th:href="@{/admin/bao-hong/create}" class="btn btn-primary"><i data-lucide="plus"></i>
                            Tạo báo hỏng mới</a>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover" id="dataTable">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Thiết bị</th>
                                            <th>Người báo</th>
                                            <th>Mô tả lỗi</th>
                                            <th>Ngày báo</th>
                                            <th>Mức độ</th>
                                            <th>Trạng thái</th>
                                            <th>Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                            <nav>
                                <ul class="pagination justify-content-center" id="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Analysis Modal (outside script block) -->
        <div class="modal fade" id="aiModal" tabindex="-1">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header" style="background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;">
                <h5 class="modal-title">🤖 AI Phân tích báo hỏng</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <div id="aiModalDevice" class="mb-2 text-muted small fw-bold"></div>
                <div id="aiModalDesc" class="mb-3 p-3 bg-light rounded fst-italic small"></div>
                <div id="aiModalLoading" class="text-center py-3">
                  <div class="spinner-border text-primary" role="status"></div>
                  <div class="mt-2 text-muted small">AI đang phân tích...</div>
                </div>
                <div id="aiModalResult" style="display:none;"></div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
              </div>
            </div>
          </div>
        </div>

    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            let currentPage = 0;
            const pageSize = 10;

            document.addEventListener('DOMContentLoaded', () => {
                loadData(0);
                lucide.createIcons();
            });

            function loadData(page) {
                fetch(`/api/admin/bao-hong?page=${page}&size=${pageSize}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            renderTable(data.data.content);
                            renderPagination(data.data);
                            currentPage = page;
                        }
                    })
                    .catch(e => console.error('Error:', e));
            }

            function renderTable(items) {
                const tbody = document.querySelector('#dataTable tbody');
                tbody.innerHTML = '';

                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">Chưa có dữ liệu</td></tr>';
                    return;
                }

                items.forEach(item => {
                    const severityBadge = item.mucDoNghiemTrong === 'KHAN_CAP' ? 'bg-danger' :
                        item.mucDoNghiemTrong === 'CAO' ? 'bg-warning' :
                            item.mucDoNghiemTrong === 'TRUNG_BINH' ? 'bg-info' : 'bg-secondary';

                    const statusBadge = item.trangThai === 'CHO_XU_LY' ? 'bg-secondary' :
                        item.trangThai === 'DANG_XU_LY' ? 'bg-warning' :
                            item.trangThai === 'HOAN_THANH' ? 'bg-success' : 'bg-dark';

                    const moTa = item.moTaLoi ? (item.moTaLoi.length > 50 ? item.moTaLoi.substring(0, 50) + '...' : item.moTaLoi) : '-';
                    const moTaSafe = (item.moTaLoi || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ').substring(0,200);
                    const tenTB = (item.thietBi && item.thietBi.tenThietBi) ? item.thietBi.tenThietBi.replace(/'/g,"\\'") : '';

                    tbody.innerHTML += `<tr>
                        <td>${item.id}</td>
                        <td>${item.thietBi?.tenThietBi || '-'}</td>
                        <td>${item.nguoiBao?.hoTen || (item.ghiChu ? '<span class="text-muted small">' + item.ghiChu.substring(0,30) + '</span>' : '-')}</td>
                        <td title="${item.moTaLoi || ''}">${moTa}</td>
                        <td>${new Date(item.ngayBao).toLocaleDateString('vi-VN')}</td>
                        <td><span class="badge ${severityBadge}">${item.mucDoNghiemTrong}</span></td>
                        <td><span class="badge ${statusBadge}">${item.trangThai}</span></td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a href="/admin/bao-hong/view/${item.id}" class="btn btn-info"><i data-lucide="eye"></i></a>
                                <a href="/admin/bao-hong/edit/${item.id}" class="btn btn-warning"><i data-lucide="edit"></i></a>
                                <button class="btn btn-danger" onclick="deleteItem(${item.id})"><i data-lucide="trash-2"></i></button>
                                <button class="btn btn-secondary" title="AI Phân tích" onclick="aiAnalyzeDamage(${item.id}, '${moTaSafe}', '${tenTB}')"><i data-lucide="sparkles"></i></button>
                            </div>
                        </td>
                    </tr>`;
                });

                lucide.createIcons();
            }

            function renderPagination(pageData) {
                const pagination = document.getElementById('pagination');
                pagination.innerHTML = '';
                if (pageData.totalPages <= 1) return;

                for (let i = 0; i < pageData.totalPages; i++) {
                    pagination.innerHTML += `<li class="page-item ${i === pageData.currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="loadData(${i});return false;">${i + 1}</a>
                    </li>`;
                }
            }

            // ===== AI ANALYZE FEATURE =====
            function aiAnalyzeDamage(id, moTa, tenThietBi) {
                document.getElementById('aiModalDevice').textContent = '🖥️ Thiết bị: ' + (tenThietBi || 'Không rõ');
                document.getElementById('aiModalDesc').textContent = 'Mô tả: ' + (moTa || '(không có mô tả)');
                document.getElementById('aiModalLoading').style.display = 'block';
                document.getElementById('aiModalResult').style.display = 'none';
                const modal = new bootstrap.Modal(document.getElementById('aiModal'));
                modal.show();

                fetch('http://localhost:5000/api/ai/analyze-damage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        description: moTa || 'Thiết bị hỏng - không có mô tả chi tiết',
                        device_name: tenThietBi || ''
                    })
                })
                .then(r => r.json())
                .then(data => {
                    document.getElementById('aiModalLoading').style.display = 'none';
                    const res = document.getElementById('aiModalResult');
                    const msg = data.analysis || data.response || data.message || JSON.stringify(data);
                    res.innerHTML = '<div class="alert alert-info"><strong>✅ Kết quả phân tích AI:</strong><br><br>' +
                        msg.replace(/\n/g,'<br>') + '</div>';
                    res.style.display = 'block';
                })
                .catch(err => {
                    document.getElementById('aiModalLoading').style.display = 'none';
                    const res = document.getElementById('aiModalResult');
                    res.innerHTML = '<div class="alert alert-danger">❌ Không kết nối được Flask AI (port 5000). Kiểm tra Flask đang chạy.</div>';
                    res.style.display = 'block';
                });
            }

            function deleteItem(id) {
                if (confirm('Bạn có chắc chắn muốn xóa?')) {
                    fetch(`/api/admin/bao-hong/${id}`, { method: 'DELETE' })
                        .then(r => r.json())
                        .then(data => {
                            if (data.success) {
                                alert('Xóa thành công!');
                                loadData(currentPage);
                            } else {
                                alert('Lỗi: ' + (data.message || 'Không thể xóa'));
                            }
                        })
                        .catch(e => {
                            console.error('Error:', e);
                            alert('Có lỗi xảy ra');
                        });
                }
            }
        </script>
    </th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - Nhân viên CSVC - QLCSVC-AI' : 'Nhân viên CSVC - QLCSVC-AI'}">Nhân viên
        CSVC - QLCSVC-AI</title>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/nhanvien.css}">
    <!-- AI Chatbot Widget CSS -->
    <link rel="stylesheet" th:href="@{/css/chatbot-widget.css(v=4)}">
    <!-- html5-qrcode for QR scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
      #qr-scan-btn {
        position:fixed; bottom:100px; right:24px; z-index:1050;
        width:52px; height:52px; border-radius:50%;
        background:linear-gradient(135deg,#10b981,#059669);
        border:none; color:white; cursor:pointer;
        box-shadow:0 4px 15px rgba(16,185,129,.45);
        display:flex; align-items:center; justify-content:center;
        transition:transform .2s, box-shadow .2s;
      }
      #qr-scan-btn:hover { transform:scale(1.1); box-shadow:0 6px 20px rgba(16,185,129,.6); }
      #qr-scan-btn svg { width:22px; height:22px; }
      #qr-scan-btn .scan-badge {
        position:absolute; top:-4px; right:-4px;
        background:#f59e0b; color:white; font-size:9px;
        font-weight:700; padding:2px 5px; border-radius:10px;
      }
    </style>
</head>

<body class="nhanvien-theme">
    <div class="dashboard-container-modern">
        <!-- Sidebar - Using Fragment -->
        <div th:replace="~{layout/nhanvien-sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <main class="main-content-modern">
            <!-- Topbar -->
            <header class="topbar-modern nhanvien-topbar">
                <div class="page-info-modern">
                    <h3 th:text="${title}">Dashboard</h3>
                    <p class="page-subtitle" th:if="${subtitle != null}" th:text="${subtitle}"></p>
                </div>
                <div class="user-menu-modern">
                    <div class="user-info">
                        <div class="user-avatar nhanvien-avatar">
                            <i data-lucide="user"></i>
                        </div>
                        <div class="user-details">
                            <span class="user-name" sec:authentication="name">Username</span>
                            <span class="user-role">Nhân viên CSVC</span>
                        </div>
                    </div>

                    <!-- Notifications -->
                    <div class="dropdown" style="position: relative; margin-right: 15px;">
                        <button class="btn notification-toggle" title="Thông báo" onclick="toggleNotificationDropdown()" style="position: relative; border: none; background: transparent;">
                            <i data-lucide="bell" style="width: 20px; height: 20px; color: #475569;"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notification-badge" style="display: none; font-size: 0.6rem; padding: 0.25em 0.4em;">
                                0
                            </span>
                        </button>
                        <div class="dropdown-menu notification-menu shadow" id="notification-dropdown" style="display: none; position: absolute; right: 0; top: 100%; min-width: 300px; max-height: 400px; overflow-y: auto; background: white; border-radius: 8px; z-index: 1000; padding: 0;">
                            <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
                            <h6 class="mb-0 fw-bold">Thông báo</h6>
                            <div class="d-flex gap-3 align-items-center">
                                <a href="javascript:void(0)" onclick="summarizeNotificationsAI()" class="text-warning small text-decoration-none fw-bold d-flex align-items-center gap-1" title="Tóm tắt bằng AI">
                                    <i data-lucide="sparkles" style="width: 14px; height: 14px;"></i> AI
                                </a>
                                <a href="javascript:void(0)" onclick="markAllAsRead()" class="text-primary small text-decoration-none">Đã đọc</a>
                            </div>
                        </div>
                        <div id="ai-summary-container" style="display: none; border-bottom: 1px solid #eee;"></div>
                            <div id="notification-list" class="list-group list-group-flush">
                                <div class="text-center p-3 text-muted small">Không có thông báo mới</div>
                            </div>
                        </div>
                    </div>

                    <form th:action="@{/logout}" method="post" style="margin: 0;">
                        <button type="submit" class="btn-logout" title="Đăng xuất">
                            <i data-lucide="log-out"></i>
                        </button>
                    </form>
                </div>
            </header>

            <div class="content-wrapper-modern">
                <!-- Content from child pages will be inserted here -->
                <div layout:fragment="content">
                    <!-- Default content if no child page -->
                </div>
            </div>
        </main>
    </div>

    <!-- AI Chatbot Widget -->
    <div th:replace="~{fragments/chatbot-widget :: chatbot-widget}" th:with="userRole='NHAN_VIEN_CSVC'"></div>

    <!-- QR Scanner Floating Button -->
    <button id="qr-scan-btn" title="Scan QR thiết bị" onclick="openQrScanner()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 18h.01M18 15h.01M21 15h.01M21 18h.01M21 21h.01M18 21h.01M15 21h.01M18 18v.01"/>
        </svg>
        <span class="scan-badge">QR</span>
    </button>
    <!-- QR Scanner Modal -->
    <div class="modal fade" id="qrScanModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered" style="max-width:400px">
        <div class="modal-content">
          <div class="modal-header" style="background:linear-gradient(135deg,#10b981,#059669);color:white;">
            <h5 class="modal-title">📷 Scan QR Thiết bị</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" onclick="stopQrScanner()"></button>
          </div>
          <div class="modal-body p-3" style="background:#0f172a;">
            <div id="qr-reader" style="width:100%;border-radius:8px;overflow:hidden;"></div>
            <div id="qr-status" class="mt-2 text-center" style="color:#94a3b8;font-size:0.82rem;">
              Hướng camera vào mã QR dán trên thiết bị
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        lucide.createIcons();

        // Active link highlighting
        document.addEventListener('DOMContentLoaded', function () {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link-modern');

            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>

    <!-- AI Chatbot Widget JS -->
    <script>window.CHATBOT_USER_ROLE = 'NHAN_VIEN_CSVC';</script>
    <script th:src="@{/js/chatbot-widget.js(v=5)}"></script>

    <!-- QR Scanner JS -->
    <script>
    let qrScanner = null;
    function openQrScanner() {
        const modal = new bootstrap.Modal(document.getElementById('qrScanModal'));
        modal.show();
        document.getElementById('qr-status').textContent = 'Đang khởi động camera...';
        document.getElementById('qrScanModal').addEventListener('shown.bs.modal', function startScan() {
            document.getElementById('qrScanModal').removeEventListener('shown.bs.modal', startScan);
            qrScanner = new Html5Qrcode('qr-reader');
            qrScanner.start(
                { facingMode: 'environment' },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    document.getElementById('qr-status').innerHTML =
                        '<span style="color:#10b981;font-weight:700;">✅ Đã nhận diện QR!</span>';
                    stopQrScanner();
                    bootstrap.Modal.getInstance(document.getElementById('qrScanModal')).hide();
                    window.location.href = decodedText.startsWith('http') ? decodedText
                        : 'http://localhost:5000/api/ai/device-info/' + decodedText;
                },
                (_err) => {}
            ).then(() => {
                document.getElementById('qr-status').textContent = 'Hướng camera vào mã QR trên thiết bị';
            }).catch(err => {
                document.getElementById('qr-status').innerHTML =
                    '<span style="color:#f87171;">❌ Không truy cập được camera: ' + err + '</span>';
            });
        }, { once: true });
    }
    function stopQrScanner() {
        if (qrScanner) { qrScanner.stop().catch(() => {}); qrScanner = null; }
    }
    document.getElementById('qrScanModal').addEventListener('hide.bs.modal', stopQrScanner);
    </script>

    <!-- Page specific scripts -->
    <th:block layout:fragment="scripts">
        <!-- Scripts from child pages will be inserted here -->
    </th:block>
    <!-- Notification System JS -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetchNotifications();
            setInterval(fetchNotifications, 30000); // Poll every 30s
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function(event) {
                const dropdown = document.getElementById('notification-dropdown');
                const toggle = document.querySelector('.notification-toggle');
                if (dropdown && dropdown.style.display === 'block') {
                    if (!dropdown.contains(event.target) && !toggle.contains(event.target)) {
                        dropdown.style.display = 'none';
                    }
                }
            });
        });

        function toggleNotificationDropdown() {
            const dropdown = document.getElementById('notification-dropdown');
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        }

        function fetchNotifications() {
            fetch('/api/notifications?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Unauthorized');
                })
                .then(data => {
                    updateNotificationUI(data.data.notifications, data.data.unreadCount);
                })
                .catch(error => console.log('Notification fetch error:', error));
        }

        function updateNotificationUI(notifications, unreadCount) {
            const badge = document.getElementById('notification-badge');
            const list = document.getElementById('notification-list');
            if(!badge || !list) return;
            
            if (unreadCount > 0) {
                badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }

            if (!notifications || notifications.length === 0) {
                list.innerHTML = '<div class="text-center p-3 text-muted small">Không có thông báo mới</div>';
                return;
            }

            let html = '';
            notifications.forEach(n => {
                const isReadClass = n.daDoc ? 'bg-light text-muted' : 'bg-white fw-bold';
                const timeStr = new Date(n.ngayTao).toLocaleString('vi-VN');
                html += `
                    <a href="${n.urlDetail || '#'}" class="list-group-item list-group-item-action ${isReadClass} p-3" onclick="markAsRead(${n.id}, event, '${n.urlDetail}')">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="badge bg-primary text-white" style="font-size: 0.65rem;">${n.loaiThongBao}</span>
                            <small class="text-muted" style="font-size: 0.7rem;">${timeStr}</small>
                        </div>
                        <p class="mb-1 text-dark" style="font-size: 0.9rem;">${n.tieuDe}</p>
                        <small class="text-secondary" style="font-size: 0.8rem;">${n.noiDung}</small>
                    </a>
                `;
            });
            list.innerHTML = html;

            // Tự động phân tích AI nếu có thông báo chưa đọc
            if (unreadCount > 0) {
                // Thêm debounce/delay để tránh gọi API quá nhiều lần khi load trang
                if (!window.aiSummaryTriggered) {
                    window.aiSummaryTriggered = true;
                    setTimeout(() => { summarizeNotificationsAI(); }, 500);
                }
            } else {
                const aiContainer = document.getElementById('ai-summary-container');
                if (aiContainer) aiContainer.style.display = 'none';
            }
        }

        function markAsRead(id, event, url) {
            if (event) event.preventDefault();
            fetch(`/api/notifications/${id}/read`, { method: 'POST' })
                .then(() => {
                    if (url && url !== 'null') window.location.href = url;
                    else fetchNotifications();
                });
        }

        function markAllAsRead() {
            fetch('/api/notifications/read-all', { method: 'POST' })
                .then(() => fetchNotifications());
        }

        function summarizeNotificationsAI() {
            const list = document.getElementById('notification-list');
            const unreadMessages = Array.from(list.querySelectorAll('.list-group-item.bg-white p.mb-1')).map(p => p.textContent);
            
            if (unreadMessages.length === 0) {
                alert("Không có thông báo chưa đọc nào để tóm tắt.");
                return;
            }

            const aiContainer = document.getElementById('ai-summary-container');
            if (aiContainer) {
                aiContainer.style.display = 'block';
                aiContainer.innerHTML = '<div class="text-center p-3"><div class="spinner-border spinner-border-sm text-warning" role="status"></div><span class="ms-2 small text-muted">AI đang đọc thông báo...</span></div>';
            }

            const promptText = "Bạn là trợ lý AI quản lý Cơ sở vật chất. Hãy tóm tắt ngắn gọn các thông báo sau thành 1-2 câu, chỉ ra việc gì cần làm gấp nhất cho tôi. Thông báo: " + unreadMessages.join('; ');
            const userId = window.CHATBOT_USER_ID || 'anonymous';
            const sessionId = sessionStorage.getItem('chatbot_session_id_' + userId) || ('sess-' + Date.now());

            fetch('http://localhost:5000/api/ai/chatbot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: promptText,
                    user_id: userId,
                    session_id: sessionId,
                    context: { user_role: window.CHATBOT_USER_ROLE || 'NHAN_VIEN_CSVC', is_system_prompt: true }
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && aiContainer) {
                    aiContainer.innerHTML = `
                        <div class="m-2 p-2 rounded" style="background-color: #fffbeb; border: 1px solid #fcd34d;">
                            <strong class="text-warning d-flex align-items-center gap-1 mb-1" style="font-size: 0.85rem;">
                                <i data-lucide="sparkles" style="width: 14px; height: 14px;"></i> Tóm tắt AI:
                            </strong>
                            <div class="small text-dark" style="line-height: 1.5;">${data.response.replace(/\n/g, '<br>')}</div>
                        </div>
                    `;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            })
            .catch(err => {
                if (aiContainer) aiContainer.innerHTML = '<div class="text-danger p-2 small text-center">Lỗi kết nối Server AI</div>';
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - Giáo viên - QLCSVC-AI' : 'Giáo viên - QLCSVC-AI'}">Giáo viên -
        QLCSVC-AI</title>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍🏫</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/giaovien.css}">
    <!-- AI Chatbot Widget CSS -->
    <link rel="stylesheet" th:href="@{/css/chatbot-widget.css}">
</head>


<body class="giaovien-theme">
    <!-- Top Navigation Bar -->
    <nav class="lms-topbar">
        <div class="lms-topbar-container">
            <!-- Logo -->
            <div class="lms-logo">
                <div class="logo-icon">
                    <i data-lucide="graduation-cap"></i>
                </div>
                <span class="logo-text">QLCSVC-AI</span>
            </div>

            <!-- Navigation Menu -->
            <div class="lms-nav-menu">
                <a href="/giao-vien" class="lms-nav-link">
                    <i data-lucide="home"></i>
                    <span>Trang chủ</span>
                </a>
                <a href="/giao-vien/thiet-bi" class="lms-nav-link">
                    <i data-lucide="monitor"></i>
                    <span>Thiết bị</span>
                </a>
                <a href="/giao-vien/muon-tra" class="lms-nav-link">
                    <i data-lucide="package"></i>
                    <span>Mượn học</span>
                </a>
                <a href="/giao-vien/bao-hong" class="lms-nav-link">
                    <i data-lucide="alert-circle"></i>
                    <span>Báo hỏng</span>
                </a>
            </div>

            <!-- Right Side Actions -->
            <div class="lms-topbar-actions">
                <!-- Language Selector -->
                <div class="lms-dropdown">
                    <button class="lms-action-btn" title="Ngôn ngữ">
                        Gần đây
                        <i data-lucide="chevron-down"></i>
                    </button>
                </div>

                <!-- Notifications -->
                <button class="lms-action-btn lms-icon-btn" title="Thông báo">
                    <i data-lucide="bell"></i>
                </button>

                <!-- Messages -->
                <button class="lms-action-btn lms-icon-btn" title="Tin nhắn">
                    <i data-lucide="message-square"></i>
                </button>

                <!-- User Menu -->
                <div class="lms-user-menu">
                    <a href="/giao-vien/profile" class="lms-user-avatar"
                        style="text-decoration: none; cursor: pointer;">
                        <i data-lucide="user"></i>
                    </a>
                    <div class="lms-user-dropdown">
                        <button class="lms-dropdown-toggle">
                            <i data-lucide="chevron-down"></i>
                        </button>
                        <div class="lms-dropdown-menu">
                            <a href="/giao-vien/profile" class="lms-dropdown-item">
                                <i data-lucide="user"></i>
                                Hồ sơ
                            </a>
                            <a href="/giao-vien/settings" class="lms-dropdown-item">
                                <i data-lucide="settings"></i>
                                Cài đặt
                            </a>
                            <div class="lms-dropdown-divider"></div>
                            <form th:action="@{/logout}" method="post" style="margin: 0;">
                                <button type="submit" class="lms-dropdown-item">
                                    <i data-lucide="log-out"></i>
                                    Đăng xuất
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Settings -->
                <button class="lms-action-btn lms-icon-btn" title="Cài đặt">
                    <i data-lucide="settings"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="lms-main-container">
        <div class="lms-content-wrapper">
            <!-- Content from child pages will be inserted here -->
            <div layout:fragment="content">
                <!-- Default content if no child page -->
            </div>
        </div>

        <!-- Footer -->
        <footer class="lms-footer">
            <div class="lms-footer-container">
                <div class="lms-footer-left">
                    <p>Copyright 2021. All rights reserved.</p>
                </div>
                <div class="lms-footer-right">
                    <a href="#" class="lms-footer-link">Quick links</a>
                    <a href="#" class="lms-footer-link">Site map</a>
                    <a href="#" class="lms-footer-link">Contact</a>
                    <a href="#" class="lms-footer-link">Help</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- AI Chatbot Widget -->
    <div th:replace="~{fragments/chatbot-widget :: chatbot-widget}" th:with="userRole='GIAO_VIEN'"></div>

    <!-- Scripts -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        lucide.createIcons();

        // Active link highlighting for LMS navigation
        document.addEventListener('DOMContentLoaded', function () {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.lms-nav-link');

            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPath || currentPath.startsWith(href + '/')) {
                    link.classList.add('active');
                }
            });

            // Reinitialize icons after DOM is ready
            setTimeout(() => {
                lucide.createIcons();
            }, 100);
        });
    </script>

    <!-- AI Chatbot Widget JS -->
    <script>window.CHATBOT_USER_ROLE = 'GIAO_VIEN';</script>
    <script th:src="@{/js/chatbot-widget.js(v=3)}"></script>

    <!-- Page specific scripts -->
    <th:block layout:fragment="scripts">
        <!-- Scripts from child pages will be inserted here -->
    </th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - QLCSVC-AI' : 'QLCSVC-AI'}">QLCSVC-AI</title>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dhnt: {
                            primary: '#0d6efd',
                            secondary: '#6c757d',
                            dark: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <!-- AI Chatbot Widget CSS -->
    <link rel="stylesheet" th:href="@{/css/chatbot-widget.css}">
    <!-- html5-qrcode for QR scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
      /* QR Scanner Floating Button */
      #qr-scan-btn {
        position: fixed; bottom: 100px; right: 24px; z-index: 1050;
        width: 52px; height: 52px; border-radius: 50%;
        background: linear-gradient(135deg, #10b981, #059669);
        border: none; color: white; cursor: pointer;
        box-shadow: 0 4px 15px rgba(16,185,129,.45);
        display: flex; align-items: center; justify-content: center;
        transition: transform .2s, box-shadow .2s;
      }
      #qr-scan-btn:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(16,185,129,.6); }
      #qr-scan-btn svg { width: 22px; height: 22px; }
      #qr-scan-btn .scan-badge {
        position: absolute; top: -4px; right: -4px;
        background: #f59e0b; color: white; font-size: 9px;
        font-weight: 700; padding: 2px 5px; border-radius: 10px;
        letter-spacing: .04em;
      }
    </style>
</head>


<body>
    <div class="dashboard-container">
        <!-- Sidebar - Using Fragment -->
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar - Using Fragment -->
            <div th:replace="~{layout/topbar :: topbar}"></div>

            <div class="content-wrapper fade-in">
                <!-- Content from child pages will be inserted here -->
                <div layout:fragment="content">
                    <!-- Default content if no child page -->
                </div>
            </div>
        </main>
    </div>

    <!-- AI Chatbot Widget -->
    <div th:replace="~{fragments/chatbot-widget :: chatbot-widget}" th:with="userRole='ADMIN'"></div>

    <!-- QR Scanner Floating Button -->
    <button id="qr-scan-btn" title="Scan QR thiết bị" onclick="openQrScanner()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 18h.01M18 15h.01M21 15h.01M21 18h.01M21 21h.01M18 21h.01M15 21h.01M18 18v.01"/>
        </svg>
        <span class="scan-badge">QR</span>
    </button>

    <!-- QR Scanner Modal -->
    <div class="modal fade" id="qrScanModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered" style="max-width:400px">
        <div class="modal-content">
          <div class="modal-header" style="background:linear-gradient(135deg,#10b981,#059669);color:white;">
            <h5 class="modal-title">📷 Scan QR Thiết bị</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" onclick="stopQrScanner()"></button>
          </div>
          <div class="modal-body p-3" style="background:#0f172a;">
            <div id="qr-reader" style="width:100%;border-radius:8px;overflow:hidden;"></div>
            <div id="qr-status" class="mt-2 text-center" style="color:#94a3b8;font-size:0.82rem;">
              Hướng camera vào mã QR dán trên thiết bị
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        lucide.createIcons();
    </script>

    <!-- AI Chatbot Widget JS -->
    <script>window.CHATBOT_USER_ROLE = 'ADMIN';</script>
    <script th:src="@{/js/chatbot-widget.js(v=3)}"></script>

    <!-- QR Scanner JS -->
    <script>
    let qrScanner = null;
    function openQrScanner() {
        const modal = new bootstrap.Modal(document.getElementById('qrScanModal'));
        modal.show();
        document.getElementById('qr-status').textContent = 'Đang khởi động camera...';
        document.getElementById('qrScanModal').addEventListener('shown.bs.modal', function startScan() {
            document.getElementById('qrScanModal').removeEventListener('shown.bs.modal', startScan);
            qrScanner = new Html5Qrcode('qr-reader');
            qrScanner.start(
                { facingMode: 'environment' },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // Scan thành công
                    document.getElementById('qr-status').innerHTML =
                        '<span style="color:#10b981;font-weight:700;">✅ Đã nhận diện QR!</span>';
                    stopQrScanner();
                    bootstrap.Modal.getInstance(document.getElementById('qrScanModal')).hide();
                    // Nếu URL → điều hướng, nếu device_id → mở trang thiết bị
                    if (decodedText.startsWith('http')) {
                        window.location.href = decodedText;
                    } else {
                        window.location.href = '/api/ai/device-info/' + decodedText;
                    }
                },
                (_err) => { /* scan errors bỏ qua */ }
            ).then(() => {
                document.getElementById('qr-status').textContent = 'Hướng camera vào mã QR dán trên thiết bị';
            }).catch(err => {
                document.getElementById('qr-status').innerHTML =
                    '<span style="color:#f87171;">❌ Không truy cập được camera: ' + err + '</span>';
            });
        }, { once: true });
    }
    function stopQrScanner() {
        if (qrScanner) {
            qrScanner.stop().catch(() => {});
            qrScanner = null;
        }
    }
    document.getElementById('qrScanModal').addEventListener('hide.bs.modal', stopQrScanner);
    </script>

    <!-- Page specific scripts -->
    <th:block layout:fragment="scripts">
        <!-- Scripts from child pages will be inserted here -->
    </th:block>
</body>

</html>

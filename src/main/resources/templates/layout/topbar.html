<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
    <!-- Topbar Fragment -->
    <header class="topbar" th:fragment="topbar">
        <div class="page-info">
            <h3 th:text="${title}">Dashboard</h3>
        </div>
        <div class="user-menu" style="display: flex; align-items: center; gap: 15px;">
            <span sec:authentication="name" style="font-weight: 600;">Username</span>
            <span sec:authentication="principal.authorities" style="font-size: 12px; color: var(--gray-500);"
                th:if="${#authorization.expression('isAuthenticated()')}">
                <span th:each="auth, iterStat : ${#authentication.authorities}">
                    <span th:if="${auth.authority == 'ROLE_ADMIN'}" class="badge bg-danger">Admin</span>
                    <span th:if="${auth.authority == 'ROLE_GIAO_VIEN'}" class="badge bg-primary">Giáo viên</span>
                    <span th:if="${auth.authority == 'ROLE_NHAN_VIEN_CSVC'}" class="badge bg-success">Nhân viên
                        CSVC</span>
                </span>
            </span>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn" style="color: var(--danger); padding: 5px;" title="Đăng xuất">
                    <i data-lucide="log-out"></i>
                </button>
            </form>
        </div>
    </header>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - QLCSVC-AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="auth-wrapper">
    <div class="auth-card fade-in">
        <div class="auth-header">
            <h1>Đăng nhập</h1>
            <p>Vui lòng đăng nhập để tiếp tục</p>
        </div>

        <div th:if="${param.error}" class="stat-card"
            style="background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); margin-bottom: 20px; padding: 12px;">
            <p style="color: var(--danger); font-size: 14px; text-align: center;">Email hoặc mật khẩu không chính xác
            </p>
        </div>

        <div th:if="${param.logout}" class="stat-card"
            style="background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); margin-bottom: 20px; padding: 12px;">
            <p style="color: var(--success); font-size: 14px; text-align: center;">Bạn đã đăng xuất thành công</p>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="admin@dhnt.edu.vn"
                    required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
                    required>
            </div>

            <button type="submit" class="btn btn-primary">
                <i data-lucide="log-in"></i> Đăng nhập
            </button>
        </form>

        <div style="margin-top: 25px; text-align: center; font-size: 14px;">
            <p style="color: var(--gray-500);">Chưa có tài khoản? <a th:href="@{/register}"
                    style="color: var(--primary); font-weight: 600;">Đăng ký ngay</a></p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>

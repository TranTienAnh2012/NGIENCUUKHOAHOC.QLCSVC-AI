<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - Nhân viên CSVC - QLCSVC-AI' : 'Nhân viên CSVC - QLCSVC-AI'}">Nhân viên
        CSVC - QLCSVC-AI</title>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/nhanvien.css}">
    <!-- AI Chatbot Widget CSS -->
    <link rel="stylesheet" th:href="@{/css/chatbot-widget.css}">
</head>

<body class="nhanvien-theme">
    <div class="dashboard-container-modern">
        <!-- Sidebar - Using Fragment -->
        <div th:replace="~{layout/nhanvien-sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <main class="main-content-modern">
            <!-- Topbar -->
            <header class="topbar-modern nhanvien-topbar">
                <div class="page-info-modern">
                    <h3 th:text="${title}">Dashboard</h3>
                    <p class="page-subtitle" th:if="${subtitle != null}" th:text="${subtitle}"></p>
                </div>
                <div class="user-menu-modern">
                    <div class="user-info">
                        <div class="user-avatar nhanvien-avatar">
                            <i data-lucide="user"></i>
                        </div>
                        <div class="user-details">
                            <span class="user-name" sec:authentication="name">Username</span>
                            <span class="user-role">Nhân viên CSVC</span>
                        </div>
                    </div>
                    <form th:action="@{/logout}" method="post" style="margin: 0;">
                        <button type="submit" class="btn-logout" title="Đăng xuất">
                            <i data-lucide="log-out"></i>
                        </button>
                    </form>
                </div>
            </header>

            <div class="content-wrapper-modern">
                <!-- Content from child pages will be inserted here -->
                <div layout:fragment="content">
                    <!-- Default content if no child page -->
                </div>
            </div>
        </main>
    </div>

    <!-- AI Chatbot Widget -->
    <div th:replace="~{fragments/chatbot-widget :: chatbot-widget}" th:with="userRole='ADMIN'"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        lucide.createIcons();

        // Active link highlighting
        document.addEventListener('DOMContentLoaded', function () {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link-modern');

            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>

    <!-- AI Chatbot Widget JS -->
    <script th:src="@{/js/chatbot-widget.js}"></script>

    <!-- Page specific scripts -->
    <th:block layout:fragment="scripts">
        <!-- Scripts from child pages will be inserted here -->
    </th:block>
</body>

</html>

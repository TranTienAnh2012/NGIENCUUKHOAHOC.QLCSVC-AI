<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - Nhân viên CSVC - QLCSVC-AI' : 'Nhân viên CSVC - QLCSVC-AI'}">Nhân viên
        CSVC - QLCSVC-AI</title>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/nhanvien.css}">
    <!-- AI Chatbot Widget CSS -->
    <link rel="stylesheet" th:href="@{/css/chatbot-widget.css}">
    <!-- html5-qrcode for QR scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
      #qr-scan-btn {
        position:fixed; bottom:100px; right:24px; z-index:1050;
        width:52px; height:52px; border-radius:50%;
        background:linear-gradient(135deg,#10b981,#059669);
        border:none; color:white; cursor:pointer;
        box-shadow:0 4px 15px rgba(16,185,129,.45);
        display:flex; align-items:center; justify-content:center;
        transition:transform .2s, box-shadow .2s;
      }
      #qr-scan-btn:hover { transform:scale(1.1); box-shadow:0 6px 20px rgba(16,185,129,.6); }
      #qr-scan-btn svg { width:22px; height:22px; }
      #qr-scan-btn .scan-badge {
        position:absolute; top:-4px; right:-4px;
        background:#f59e0b; color:white; font-size:9px;
        font-weight:700; padding:2px 5px; border-radius:10px;
      }
    </style>
</head>

<body class="nhanvien-theme">
    <div class="dashboard-container-modern">
        <!-- Sidebar - Using Fragment -->
        <div th:replace="~{layout/nhanvien-sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <main class="main-content-modern">
            <!-- Topbar -->
            <header class="topbar-modern nhanvien-topbar">
                <div class="page-info-modern">
                    <h3 th:text="${title}">Dashboard</h3>
                    <p class="page-subtitle" th:if="${subtitle != null}" th:text="${subtitle}"></p>
                </div>
                <div class="user-menu-modern">
                    <a th:href="@{/nhanvien-csvc/profile}" class="user-info text-decoration-none" style="color: inherit;">
                        <div class="user-avatar nhanvien-avatar">
                            <i data-lucide="user"></i>
                        </div>
                        <div class="user-details">
                            <span class="user-name" sec:authentication="name">Username</span>
                            <span class="user-role">Nhân viên CSVC</span>
                        </div>
                    </a>
                    <!-- Notification Bell (Nhân viên) -->
                    <div class="position-relative" style="margin-right: 4px;">
                        <button id="nv-notif-btn" data-bs-toggle="dropdown" aria-expanded="false" title="Thông báo"
                            style="background:none;border:none;padding:6px 8px;cursor:pointer;color:#64748b;position:relative;border-radius:8px;transition:background .15s;"
                            onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='none'">
                            <i data-lucide="bell" style="width:20px;height:20px;display:block;"></i>
                            <span id="nv-notif-badge"
                                style="display:none;position:absolute;top:2px;right:2px;background:#ef4444;color:#fff;font-size:0.55rem;font-weight:700;padding:1px 4px;border-radius:999px;min-width:16px;text-align:center;line-height:1.4;">0</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="nv-notif-list" style="width:340px;max-height:420px;overflow-y:auto;padding:0;box-shadow:0 10px 40px rgba(0,0,0,.25);border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:#1e293b;">
                            <li id="nv-ai-summary-container" style="display:none;border-bottom:1px solid rgba(255,255,255,0.08);">
                                <div id="nv-ai-summary-content" style="padding:10px 14px;background:linear-gradient(135deg,#064e3b,#065f46);font-size:0.82rem;color:#6ee7b7;line-height:1.6;border-radius:11px 11px 0 0;"></div>
                            </li>
                            <li><div class="p-3 text-center" style="color:#64748b;">Không có thông báo mới</div></li>
                        </ul>
                    </div>
                    <form th:action="@{/logout}" method="post" style="margin: 0;">
                        <button type="submit" class="btn-logout" title="Đăng xuất">
                            <i data-lucide="log-out"></i>
                        </button>
                    </form>
                </div>
            </header>

            <div class="content-wrapper-modern">
                <!-- Content from child pages will be inserted here -->
                <div layout:fragment="content">
                    <!-- Default content if no child page -->
                </div>
            </div>
        </main>
    </div>

    <!-- AI Chatbot Widget -->
    <div th:replace="~{fragments/chatbot-widget :: chatbot-widget}" th:with="userRole='NHAN_VIEN_CSVC'"></div>

    <!-- Redirect to Flask AI Scan page -->
    <button id="qr-scan-btn" title="Scan QR thiết bị" onclick="window.location.href='http://localhost:5000/api/ai/scan'">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 18h.01M18 15h.01M21 15h.01M21 18h.01M21 21h.01M18 21h.01M15 21h.01M18 18v.01"/>
        </svg>
        <span class="scan-badge">AI</span>
    </button>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        lucide.createIcons();

        // Active link highlighting
        document.addEventListener('DOMContentLoaded', function () {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link-modern');

            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>

    <!-- AI Chatbot Widget JS -->
    <script>window.CHATBOT_USER_ROLE = 'NHAN_VIEN_CSVC';</script>
    <script th:src="@{/js/chatbot-widget.js(v=5)}"></script>

    <!-- Notification + AI Summary for Nhan Vien -->
    <script>
    (function() {
        let nvAiDone = false;

        function summarizeNvAI(notifications) {
            if (!notifications || !notifications.length) return;
            const container = document.getElementById('nv-ai-summary-container');
            const content = document.getElementById('nv-ai-summary-content');
            if (!container || !content) return;
            content.innerHTML = '✨ <strong>AI đang phân tích...</strong>';
            container.style.display = 'block';
            const texts = notifications.map(n => `- ${n.tieuDe}: ${n.noiDung}`).join('\n');
            fetch('http://localhost:5000/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Tóm tắt ngắn gọn (2-3 dòng) các thông báo sau theo góc nhìn Nhân viên CSVC:\n${texts}`, role: 'NHAN_VIEN_CSVC' })
            }).then(r => r.json()).then(d => {
                content.innerHTML = '✨ <strong>AI Tóm tắt:</strong> ' + (d.response || d.reply || d.message || 'N/A');
            }).catch(() => { container.style.display = 'none'; });
        }

        function fetchNvNotifications() {
            fetch('/api/thong-bao/unread').then(r => r.ok ? r.json() : null).then(data => {
                if (!data) return;
                const badge = document.getElementById('nv-notif-badge');
                const list = document.getElementById('nv-notif-list');
                if (data.count > 0) {
                    badge.style.display = 'block';
                    badge.textContent = data.count;
                    let html = '<li id="nv-ai-summary-container" style="display:none;border-bottom:1px solid #e2e8f0;"><div id="nv-ai-summary-content" style="padding:10px 14px;background:linear-gradient(135deg,#064e3b,#065f46);font-size:0.82rem;color:#6ee7b7;line-height:1.6;"></div></li>';
                    var displayList = data.notifications.slice(0, 5);
                    displayList.forEach(n => {
                        function parseDate(v) {
                            if (!v) return null;
                            if (Array.isArray(v)) return new Date(v[0], v[1]-1, v[2], v[3]||0, v[4]||0, v[5]||0);
                            return new Date(v);
                        }
                        const dt = parseDate(n.createdAt);
                        const d = dt ? dt.toLocaleDateString('vi-VN', {hour:'2-digit',minute:'2-digit'}) : '';
                        html += `<li style="border-bottom:1px solid #f1f5f9;">
                            <a class="dropdown-item d-flex flex-column p-3" href="#" style="white-space:normal;" onclick="event.preventDefault();fetch('/api/thong-bao/${n.id}/read',{method:'PUT'}).then(()=>fetchNvNotifications())">
                                <strong style="color:#059669;font-size:0.9rem;">${n.tieuDe}</strong>
                                <span style="font-size:0.82rem;color:#64748b;margin-top:4px;">${n.noiDung}</span>
                                <small style="color:#94a3b8;font-size:0.72rem;align-self:flex-end;margin-top:6px;">${d}</small>
                            </a></li>`;
                    });
                    if (data.count > 5) {
                        html += `<li><div class="text-center p-2"><small style="color:#94a3b8;">Còn ${data.count - 5} thông báo khác...</small></div></li>`;
                    }
                    html += '<li style="border-top:1px solid rgba(255,255,255,0.08);"><a href="/thong-bao" class="dropdown-item text-center py-2" style="font-weight:600;color:#10b981;">Xem tất cả thông báo</a></li>';
                    list.innerHTML = html;
                    if (!nvAiDone) { nvAiDone = true; setTimeout(() => summarizeNvAI(data.notifications.slice(0, 5)), 600); }
                } else {
                    badge.style.display = 'none';
                    list.innerHTML = '<li><div class="p-3 text-center text-muted">Không có thông báo mới</div></li>';
                }
            }).catch(() => {});
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchNvNotifications();
            fetchNhanVienBadges();
            setInterval(fetchNvNotifications, 30000);
            setInterval(fetchNhanVienBadges, 30000);
        });

        function fetchNhanVienBadges() {
            fetch('/api/nhanvien-csvc/bao-hong/assignment/count')
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if(data && data.success) {
                        const count = data.data;
                        const badgeCount = document.querySelector('.nhanvien-sidebar .badge-count');
                        const statValue = document.querySelector('.nhanvien-sidebar .stat-value');
                        if(badgeCount) {
                            badgeCount.textContent = count;
                            badgeCount.style.display = count > 0 ? 'inline-block' : 'none';
                        }
                        if(statValue) statValue.textContent = count;
                    }
                }).catch(() => {});
        }
    })();
    </script>

    <!-- QR Scanner logic removed - using Flask AI Scan page -->

    <!-- Page specific scripts -->
    <th:block layout:fragment="scripts">
        <!-- Scripts from child pages will be inserted here -->
    </th:block>
</body>

</html>

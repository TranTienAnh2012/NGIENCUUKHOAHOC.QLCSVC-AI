<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
    <!-- Sidebar Fragment for Giao Vien -->
    <aside class="giaovien-sidebar" th:fragment="sidebar" style="display: block !important; background: #09090b; border-right: 1px solid rgba(255,255,255,0.05);">
        <div class="sidebar-header-modern" style="border-bottom: 1px solid rgba(255,255,255,0.05); padding: 24px;">
            <div class="logo-container">
                <div class="logo-icon" style="background: #10b981; border-radius: 8px;">
                    <i data-lucide="monitor"></i>
                </div>
                <div class="logo-text">
                    <h2 style="color: white; font-size: 20px; font-weight: 700;">QLCSVC</h2>
                    <span class="role-badge giaovien-badge" style="background: rgba(16, 185, 129, 0.1); color: #10b981; border: none;">Giáo viên</span>
                </div>
            </div>
        </div>

        <nav class="sidebar-nav-modern" style="padding: 20px 16px;">
            <ul style="list-style: none; padding: 0;">
                <li class="nav-item">
                    <a th:href="@{/giao-vien}" class="nav-link-modern" style="color: #a1a1aa; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none;">
                        <i data-lucide="layout-dashboard" style="width: 20px;"></i>
                        <span>Dashboard</span>
                    </a>
                </li>

                <li class="nav-divider-modern" style="padding: 24px 16px 12px;">
                    <span style="font-size: 11px; text-transform: uppercase; color: #52525b; letter-spacing: 1px; font-weight: 700;">Hoạt động</span>
                </li>

                <li class="nav-item">
                    <a th:href="@{/giao-vien/muon-tra}" class="nav-link-modern" style="color: #a1a1aa; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none;">
                        <i data-lucide="repeat" style="width: 20px;"></i>
                        <span>Mượn trả</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/giao-vien/bao-hong}" class="nav-link-modern" style="color: #a1a1aa; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none;">
                        <i data-lucide="alert-triangle" style="width: 20px;"></i>
                        <span>Báo hỏng</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/giao-vien/thiet-bi}" class="nav-link-modern" style="color: #a1a1aa; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none;">
                        <i data-lucide="monitor" style="width: 20px;"></i>
                        <span>Thiết bị</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>
</body>

</html>

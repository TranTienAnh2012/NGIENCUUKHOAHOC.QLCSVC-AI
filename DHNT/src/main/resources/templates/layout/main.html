<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - QLCSVC-AI' : 'QLCSVC-AI'}">QLCSVC-AI</title>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dhnt: {
                            primary: '#0d6efd',
                            secondary: '#6c757d',
                            dark: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <!-- AI Chatbot Widget CSS -->
    <link rel="stylesheet" th:href="@{/css/chatbot-widget.css}">
    <!-- html5-qrcode for QR scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
      /* QR Scanner Floating Button */
      #qr-scan-btn {
        position: fixed; bottom: 100px; right: 24px; z-index: 1050;
        width: 52px; height: 52px; border-radius: 50%;
        background: linear-gradient(135deg, #10b981, #059669);
        border: none; color: white; cursor: pointer;
        box-shadow: 0 4px 15px rgba(16,185,129,.45);
        display: flex; align-items: center; justify-content: center;
        transition: transform .2s, box-shadow .2s;
      }
      #qr-scan-btn:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(16,185,129,.6); }
      #qr-scan-btn svg { width: 22px; height: 22px; }
      #qr-scan-btn .scan-badge {
        position: absolute; top: -4px; right: -4px;
        background: #f59e0b; color: white; font-size: 9px;
        font-weight: 700; padding: 2px 5px; border-radius: 10px;
        letter-spacing: .04em;
      }
    </style>
</head>


<body>
    <div class="dashboard-container">
        <!-- Sidebar - Using Fragment -->
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar - Using Fragment -->
            <div th:replace="~{layout/topbar :: topbar}"></div>

            <div class="content-wrapper fade-in">
                <!-- Content from child pages will be inserted here -->
                <div layout:fragment="content">
                    <!-- Default content if no child page -->
                </div>
            </div>
        </main>
    </div>

    <!-- AI Chatbot Widget -->
    <div th:replace="~{fragments/chatbot-widget :: chatbot-widget}" th:with="userRole='ADMIN'"></div>

    <!-- Redirect to Flask AI Scan page -->
    <button id="qr-scan-btn" title="Scan QR thiết bị" onclick="window.location.href='http://localhost:5000/api/ai/scan'">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 18h.01M18 15h.01M21 15h.01M21 18h.01M21 21h.01M18 21h.01M15 21h.01M18 18v.01"/>
        </svg>
        <span class="scan-badge">AI</span>
    </button>

    <!-- Scripts -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        lucide.createIcons();
    </script>

    <!-- Notification Bell Script (Admin) -->
    <script>
    (function() {
        function fetchNotifications() {
            fetch('/api/thong-bao/unread', { cache: 'no-store' })
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(function(data) {
                    if (!data) return;
                    var badge = document.getElementById('notif-badge');
                    var list = document.getElementById('notif-list');
                    if (!badge || !list) return;

                    if (data.count > 0) {
                        badge.style.display = 'block';
                        badge.textContent = data.count;

                        var html = '<li style="padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-weight: 600; color: #334155;">Thông báo mới (' + data.count + ')</li>';

                        var displayList = data.notifications.slice(0, 5);
                        displayList.forEach(function(n) {
                            var dt = null;
                            if (n.createdAt) {
                                if (Array.isArray(n.createdAt)) {
                                    dt = new Date(n.createdAt[0], n.createdAt[1]-1, n.createdAt[2], n.createdAt[3]||0, n.createdAt[4]||0, n.createdAt[5]||0);
                                } else {
                                    dt = new Date(n.createdAt);
                                }
                            }
                            var d = dt ? dt.toLocaleDateString('vi-VN', {hour:'2-digit',minute:'2-digit'}) : '';
                            var targetUrl = n.urlDetail ? n.urlDetail : '/thong-bao';

                            html += '<li style="border-bottom:1px solid #f1f5f9;">'
                                + '<a class="dropdown-item d-flex flex-column p-3" href="' + targetUrl + '" style="white-space:normal;" onclick="fetch(\'/api/thong-bao/' + n.id + '/read\',{method:\'PUT\'})">'
                                + '<strong style="color:#0f172a;font-size:0.9rem;">' + (n.tieuDe || '') + '</strong>'
                                + '<span style="font-size:0.82rem;color:#64748b;margin-top:4px;">' + (n.noiDung || '') + '</span>'
                                + '<small style="color:#94a3b8;font-size:0.72rem;align-self:flex-end;margin-top:6px;">' + d + '</small>'
                                + '</a></li>';
                        });

                        if (data.count > 5) {
                            html += '<li><div class="text-center p-2"><small class="text-muted">Còn ' + (data.count - 5) + ' thông báo khác...</small></div></li>';
                        }

                        html += '<li style="border-top:1px solid #e2e8f0;"><a href="/thong-bao" class="dropdown-item text-center text-primary py-2" style="font-weight:600;"><i data-lucide="layout-dashboard" class="me-1" style="width:16px;"></i>Đến TT Thông báo AI</a></li>';

                        list.innerHTML = html;
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    } else {
                        badge.style.display = 'none';
                        list.innerHTML = '<li><div class="p-3 text-center text-muted">Không có thông báo mới</div></li>'
                            + '<li style="border-top:1px solid #e2e8f0;"><a href="/thong-bao" class="dropdown-item text-center text-primary py-2" style="font-weight:600;"><i data-lucide="layout-dashboard" class="me-1" style="width:16px;"></i>Đến TT Thông báo AI</a></li>';
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    }
                })
                .catch(function(err) { console.warn('[Notif] fetch error:', err); });
        }

        document.addEventListener('DOMContentLoaded', function() {
            fetchNotifications();
            setInterval(fetchNotifications, 30000);
        });
    })();
    </script>

    <!-- AI Chatbot Widget JS -->
    <script>window.CHATBOT_USER_ROLE = 'ADMIN';</script>
    <script th:src="@{/js/chatbot-widget.js(v=3)}"></script>

    <!-- QR Scanner logic removed - using Flask AI Scan page -->

    <!-- Page specific scripts -->
    <th:block layout:fragment="scripts">
        <!-- Scripts from child pages will be inserted here -->
    </th:block>
</body>

</html>

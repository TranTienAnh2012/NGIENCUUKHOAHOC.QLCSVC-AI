<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
    <!-- Topbar Fragment -->
    <header class="topbar" th:fragment="topbar">
        <div class="page-info">
            <h3 th:text="${title}">Dashboard</h3>
        </div>
        <div class="user-menu" style="display: flex; align-items: center; gap: 15px;">
            <!-- Notification Bell (Admin) -->
            <div class="position-relative" id="admin-notification-wrap">
                <button id="admin-notif-btn" data-bs-toggle="dropdown" aria-expanded="false" title="Thông báo"
                    style="background:none;border:none;padding:6px 8px;cursor:pointer;color:var(--gray-500);position:relative;border-radius:8px;transition:background .15s;"
                    onmouseover="this.style.background='rgba(0,0,0,0.06)'" onmouseout="this.style.background='none'">
                    <i data-lucide="bell" style="width:20px;height:20px;display:block;"></i>
                    <span id="admin-notif-badge"
                        style="display:none;position:absolute;top:2px;right:2px;background:#ef4444;color:#fff;font-size:0.55rem;font-weight:700;padding:1px 4px;border-radius:999px;min-width:16px;text-align:center;line-height:1.4;">0</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" id="admin-notif-list" style="width:340px;max-height:420px;overflow-y:auto;padding:0;box-shadow:0 10px 40px rgba(0,0,0,.18);border-radius:12px;border:1px solid #e2e8f0;">
                    <li id="admin-ai-summary-container" style="display:none;border-bottom:1px solid #e2e8f0;">
                        <div id="admin-ai-summary-content" style="padding:10px 14px;background:linear-gradient(135deg,#1e3a5f,#1e40af);font-size:0.82rem;color:#93c5fd;line-height:1.6;border-radius:11px 11px 0 0;"></div>
                    </li>
                    <li><div class="p-3 text-center text-muted">Không có thông báo mới</div></li>
                </ul>
            </div>

            <span sec:authentication="name" style="font-weight: 600;">Username</span>
            <span sec:authentication="principal.authorities" style="font-size: 12px; color: var(--gray-500);"
                th:if="${#authorization.expression('isAuthenticated()')}">
                <span th:each="auth, iterStat : ${#authentication.authorities}">
                    <span th:if="${auth.authority == 'ROLE_ADMIN'}" class="badge bg-danger">Admin</span>
                    <span th:if="${auth.authority == 'ROLE_GIAO_VIEN'}" class="badge bg-primary">Giáo viên</span>
                    <span th:if="${auth.authority == 'ROLE_NHAN_VIEN_CSVC'}" class="badge bg-success">Nhân viên
                        CSVC</span>
                </span>
            </span>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn" style="color: var(--danger); padding: 5px;" title="Đăng xuất">
                    <i data-lucide="log-out"></i>
                </button>
            </form>
        </div>
    </header>

    <script>
    (function() {
        let aiDone = false;

        function summarizeAdminAI(notifications) {
            if (!notifications || !notifications.length) return;
            const container = document.getElementById('admin-ai-summary-container');
            const content = document.getElementById('admin-ai-summary-content');
            if (!container || !content) return;
            content.innerHTML = '✨ <strong>AI đang phân tích...</strong>';
            container.style.display = 'block';
            const texts = notifications.map(n => `- ${n.tieuDe}: ${n.noiDung}`).join('\n');
            fetch('/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Tóm tắt ngắn gọn (2-3 dòng) các thông báo hệ thống sau theo góc nhìn Quản trị viên:\n${texts}`, role: 'ADMIN' })
            }).then(r => r.json()).then(d => {
                content.innerHTML = '✨ <strong>AI Tóm tắt:</strong> ' + (d.response || d.reply || d.message || 'N/A');
            }).catch(() => { container.style.display = 'none'; });
        }

        function fetchAdminNotifications() {
            fetch('/api/thong-bao/unread').then(r => r.ok ? r.json() : null).then(data => {
                if (!data) return;
                const badge = document.getElementById('admin-notif-badge');
                const list = document.getElementById('admin-notif-list');
                if (data.count > 0) {
                    badge.style.display = 'block';
                    badge.textContent = data.count;
                    let html = '<li id="admin-ai-summary-container" style="display:none;border-bottom:1px solid #e2e8f0;"><div id="admin-ai-summary-content" style="padding:10px 14px;background:linear-gradient(135deg,#1e3a5f,#1e40af);font-size:0.82rem;color:#93c5fd;line-height:1.6;"></div></li>';
                    data.notifications.forEach(n => {
                        function parseDate(v) {
                            if (!v) return null;
                            if (Array.isArray(v)) return new Date(v[0], v[1]-1, v[2], v[3]||0, v[4]||0, v[5]||0);
                            return new Date(v);
                        }
                        const dt = parseDate(n.createdAt);
                        const d = dt ? dt.toLocaleDateString('vi-VN', {hour:'2-digit',minute:'2-digit'}) : '';
                        html += `<li style="border-bottom:1px solid #f1f5f9;">
                            <a class="dropdown-item d-flex flex-column p-3" href="#" style="white-space:normal;" onclick="event.preventDefault();fetch('/api/thong-bao/${n.id}/read',{method:'PUT'}).then(()=>fetchAdminNotifications())">
                                <strong style="color:#1e40af;font-size:0.9rem;">${n.tieuDe}</strong>
                                <span style="font-size:0.82rem;color:#64748b;margin-top:4px;">${n.noiDung}</span>
                                <small style="color:#94a3b8;font-size:0.72rem;align-self:flex-end;margin-top:6px;">${d}</small>
                            </a></li>`;
                    });
                    list.innerHTML = html;
                    if (!aiDone) { aiDone = true; setTimeout(() => summarizeAdminAI(data.notifications), 600); }
                } else {
                    badge.style.display = 'none';
                    list.innerHTML = '<li><div class="p-3 text-center text-muted">Không có thông báo mới</div></li>';
                }
            }).catch(() => {});
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchAdminNotifications();
            setInterval(fetchAdminNotifications, 30000);
        });
    })();
    </script>
</body>

</html>

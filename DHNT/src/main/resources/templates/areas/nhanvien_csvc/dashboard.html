<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<head>
    <title>Dashboard Nhân viên CSVC</title>
</head>

<body>
    <div th:fragment="content">
        <div class="card-grid">
            <div class="stat-card">
                <span class="stat-label">Phiếu báo hỏng mới</span>
                <span class="stat-value">8</span>
                <span style="color: var(--danger); font-size: 13px;">Cần xác nhận ngay</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Thiết bị đang bảo trì</span>
                <span class="stat-value">12</span>
                <span style="color: var(--warning); font-size: 13px;">6 phiếu dự kiến hoàn thành hôm nay</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Kho thiết bị dự phòng</span>
                <span class="stat-value">156</span>
                <span style="color: var(--success); font-size: 13px;">Thiết bị sẵn sàng thay thế</span>
            </div>
        </div>

        <div class="stat-card" style="margin-top: 30px;">
            <h4 style="font-size: 18px; font-weight: 700; margin-bottom: 20px;">Báo hỏng khẩn cấp</h4>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div
                    style="display: flex; align-items: center; gap: 15px; padding: 15px; border-radius: 10px; border: 1px solid rgba(239, 68, 68, 0.2); background: rgba(239, 68, 68, 0.02);">
                    <div style="width: 10px; height: 10px; border-radius: 50%; background: var(--danger);"></div>
                    <div style="flex: 1;">
                        <p style="font-weight: 600;">Hỏng điều hòa Trung tâm - Phòng P502</p>
                        <p style="color: var(--gray-500); font-size: 13px;">Người báo: GV. Nguyễn Văn A | Mức độ: Khẩn
                            cấp</p>
                    </div>
                    <button class="btn"
                        style="background: var(--dark); color: var(--white); font-size: 13px; padding: 8px 16px;">Xử lý
                        ngay</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/nhanvien-layout}">

<head>
    <title th:text="${title}">Danh sách báo hỏng</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1" th:text="${title}">Danh sách báo hỏng</h4>
                            <p class="text-muted small mb-0">Quản lý phiếu báo hỏng từ giáo viên</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="row mb-3">
                <div class="col-md-3">
                    <select class="form-select" id="filterTrangThai">
                        <option value="">Tất cả trạng thái</option>
                        <option value="CHO_XU_LY">Chờ xử lý</option>
                        <option value="DANG_XU_LY">Đang xử lý</option>
                        <option value="HOAN_THANH">Hoàn thành</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filterMucDo">
                        <option value="">Tất cả mức độ</option>
                        <option value="KHAN_CAP">Khẩn cấp</option>
                        <option value="CAO">Cao</option>
                        <option value="TRUNG_BINH">Trung bình</option>
                        <option value="THAP">Thấp</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <input type="text" class="form-control" id="searchInput" placeholder="Tìm kiếm thiết bị...">
                </div>
            </div>

            <!-- Table -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover" id="dataTable">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Thiết bị</th>
                                            <th>Người báo</th>
                                            <th>Ngày báo</th>
                                            <th>Mức độ</th>
                                            <th>Phân công</th>
                                            <th>Trạng thái</th>
                                            <th>Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="item : ${baoHongs}">
                                            <td th:text="${item.id}">1</td>
                                            <td th:text="${item.thietBi?.tenThietBi}">Máy chiếu</td>
                                            <td th:text="${item.nguoiBao?.hoTen}">Nguyễn Văn A</td>
                                            <td th:text="${#temporals.format(item.ngayBao, 'dd/MM/yyyy HH:mm')}">
                                                22/01/2026</td>
                                            <td>
                                                <span
                                                    th:class="'badge ' + ${item.mucDoNghiemTrong == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.MucDoNghiemTrong).KHAN_CAP ? 'bg-danger' : 
                                                    item.mucDoNghiemTrong == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.MucDoNghiemTrong).CAO ? 'bg-warning' : 
                                                    item.mucDoNghiemTrong == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.MucDoNghiemTrong).TRUNG_BINH ? 'bg-info' : 'bg-secondary'}"
                                                    th:text="${item.mucDoNghiemTrong}">TRUNG_BINH</span>
                                            </td>
                                            <td>
                                                <span th:if="${item.trangThaiPhanCong != null}"
                                                    th:class="'badge ' + ${item.trangThaiPhanCong == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiPhanCong).CHUA_PHAN_CONG ? 'bg-secondary' : 
                                                    item.trangThaiPhanCong == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiPhanCong).CHO_XAC_NHAN ? 'bg-warning text-dark' : 
                                                    item.trangThaiPhanCong == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiPhanCong).DA_NHAN ? 'bg-success' : 'bg-danger'}"
                                                    th:text="${item.trangThaiPhanCong}">CHO_XAC_NHAN</span>
                                            </td>
                                            <td>
                                                <span
                                                    th:class="'badge ' + ${item.trangThai == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiBaoHong).CHO_XU_LY ? 'bg-warning' : 
                                                    item.trangThai == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiBaoHong).DANG_XU_LY ? 'bg-info' : 
                                                    item.trangThai == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiBaoHong).HOAN_THANH ? 'bg-success' : 'bg-secondary'}"
                                                    th:text="${item.trangThai}">CHO_XU_LY</span>
                                            </td>
                                            <td>
                                                <div class="btn-group btn-group-sm">
                                                    <a th:href="@{/nhanvien-csvc/bao-hong/{id}(id=${item.id})}"
                                                        class="btn btn-info" title="Xem chi tiết">
                                                        <i data-lucide="eye"></i>
                                                    </a>
                                                    
                                                    <!-- Nút Nhận việc / Từ chối (chỉ hiện khi CHO_XAC_NHAN) -->
                                                    <button th:if="${item.trangThaiPhanCong == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiPhanCong).CHO_XAC_NHAN}"
                                                        class="btn btn-primary" th:onclick="'acceptTask(' + ${item.id} + ')'" title="Nhận việc">
                                                        <i data-lucide="check-circle"></i> Nhận
                                                    </button>
                                                    <button th:if="${item.trangThaiPhanCong == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiPhanCong).CHO_XAC_NHAN}"
                                                        class="btn btn-danger" th:onclick="'rejectTask(' + ${item.id} + ')'" title="Từ chối">
                                                        <i data-lucide="x-circle"></i> Từ chối
                                                    </button>
                                                    
                                                    <!-- AI Tự động xử lý -->
                                                    <button th:if="${(item.trangThaiPhanCong == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiPhanCong).CHO_XAC_NHAN or item.trangThaiPhanCong == null or item.trangThaiPhanCong == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiPhanCong).CHUA_PHAN_CONG) and item.trangThai == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiBaoHong).CHO_XU_LY}"
                                                        class="btn btn-dark" th:onclick="'aiAutoSchedule(' + ${item.id} + ')'" title="AI tự động nhận và tạo lịch">
                                                        <i data-lucide="bot"></i> AI Xử lý
                                                    </button>

                                                    <!-- Lên lịch bảo trì (chỉ khi đã nhận) -->
                                                    <a th:if="${item.trangThaiPhanCong == T(com.Tta.QLCSVC.DHNT.entity.BaoHong.TrangThaiPhanCong).DA_NHAN}"
                                                        th:href="@{/nhanvien-csvc/bao-tri/create(baoHongId=${item.id})}"
                                                        class="btn btn-success" title="Lên lịch bảo trì">
                                                        <i data-lucide="calendar-plus"></i> Tạo BT
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', () => {
                lucide.createIcons();

                const filterTrangThai = document.getElementById('filterTrangThai');
                const filterMucDo = document.getElementById('filterMucDo');
                const searchInput = document.getElementById('searchInput');
                const table = document.getElementById('dataTable');
                const rows = table.querySelectorAll('tbody tr');

                function filterTable() {
                    const trangThaiValue = filterTrangThai.value.toLowerCase();
                    const mucDoValue = filterMucDo.value.toLowerCase();
                    const searchValue = searchInput.value.toLowerCase();

                    rows.forEach(row => {
                        const trangThai = row.cells[5].textContent.toLowerCase();
                        const mucDo = row.cells[4].textContent.toLowerCase();
                        const thietBi = row.cells[1].textContent.toLowerCase();

                        const matchTrangThai = !trangThaiValue || trangThai.includes(trangThaiValue);
                        const matchMucDo = !mucDoValue || mucDo.includes(mucDoValue);
                        const matchSearch = !searchValue || thietBi.includes(searchValue);

                        row.style.display = matchTrangThai && matchMucDo && matchSearch ? '' : 'none';
                    });
                }

                filterTrangThai.addEventListener('change', filterTable);
                filterMucDo.addEventListener('change', filterTable);
                searchInput.addEventListener('input', filterTable);

                // Gán vào window để inline onclick có thể gọi được
                window.acceptTask = function(id) {
                    if (confirm('Bạn có chắc chắn muốn nhận xử lý phiếu báo hỏng này?')) {
                        fetch(`/api/nhanvien-csvc/bao-hong/${id}/accept`, {
                            method: 'POST'
                        })
                        .then(r => r.json())
                        .then(res => {
                            if (res.success) {
                                alert('Đã nhận việc thành công!');
                                window.location.reload();
                            } else {
                                alert('Lỗi: ' + (res.message || 'Không thể nhận việc'));
                            }
                        })
                        .catch(e => {
                            console.error('Error:', e);
                            alert('Có lỗi xảy ra khi gọi API');
                        });
                    }
                };

                window.rejectTask = function(id) {
                    const lyDo = prompt('Vui lòng nhập lý do từ chối:');
                    if (lyDo !== null) { // null if user clicks Cancel
                        if (!lyDo.trim()) {
                            alert('Bạn phải nhập lý do từ chối!');
                            return;
                        }
                        fetch(`/api/nhanvien-csvc/bao-hong/${id}/reject`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ lyDoTuChoi: lyDo })
                        })
                        .then(r => r.json())
                        .then(res => {
                            if (res.success) {
                                alert('Đã từ chối công việc.');
                                window.location.reload();
                            } else {
                                alert('Lỗi: ' + (res.message || 'Không thể từ chối'));
                            }
                        })
                        .catch(e => {
                            console.error('Error:', e);
                            alert('Có lỗi xảy ra khi gọi API');
                        });
                    }
                };

                window.aiAutoSchedule = function(id) {
                    if (confirm('AI sẽ tự động phân tích và tạo lịch bảo trì cho bạn. Xác nhận?')) {
                        // show loading
                        alert('Đang xử lý...');
                        fetch(`/api/nhanvien-csvc/bao-hong/${id}/ai-auto-schedule`, {
                            method: 'POST'
                        })
                        .then(r => r.json())
                        .then(res => {
                            if (res.success) {
                                alert(res.message);
                                window.location.reload();
                            } else {
                                alert('Lỗi: ' + (res.message || 'Không thể tạo lịch'));
                            }
                        })
                        .catch(e => {
                            console.error('Error:', e);
                            alert('Có lỗi xảy ra khi gọi API');
                        });
                    }
                };
            });
        </script>
    </th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title>Giám sát dữ liệu cảm biến</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h1 class="h3 mb-0">Giám sát dữ liệu cảm biến</h1>
                            <p class="text-muted mb-0">Nhật ký dữ liệu IoT</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover" id="iotTable">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Phòng</th>
                                    <th>Nhiệt độ (°C)</th>
                                    <th>Độ ẩm (%)</th>
                                    <th>Ánh sáng (Lux)</th>
                                    <th>Thời gian</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="iotData">
                                <!-- Data will be loaded via JavaScript -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center" id="pagination">
                            <!-- Pagination will be loaded via JavaScript -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            let currentPage = 0;
            const pageSize = 10;

            document.addEventListener('DOMContentLoaded', function () {
                loadData(0);
            });

            function loadData(page) {
                currentPage = page;
                fetch(`/api/admin/iot?page=${page}&size=${pageSize}`, {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                })
                    .then(response => response.json())
                    .then(res => {
                        if (res.success) {
                            renderTable(res.data.content);
                            renderPagination(res.data);
                        } else {
                            alert('Lỗi: ' + res.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Đã xảy ra lỗi khi tải dữ liệu');
                    });
            }

            function renderTable(data) {
                const tbody = document.getElementById('iotData');
                tbody.innerHTML = '';

                data.forEach(item => {
                    const row = `
                        <tr>
                            <td>${item.id}</td>
                            <td>${item.phong ? item.phong.tenPhong : 'N/A'}</td>
                            <td class="${item.nhietDo > 30 ? 'text-danger' : ''}">${item.nhietDo.toFixed(1)}</td>
                            <td>${item.doAm.toFixed(1)}</td>
                            <td>${item.anhSang.toFixed(0)}</td>
                            <td>${new Date(item.timestamp).toLocaleString('vi-VN')}</td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            }

            function renderPagination(pageData) {
                const pagination = document.getElementById('pagination');
                pagination.innerHTML = '';

                // Previous
                pagination.innerHTML += `
                    <li class="page-item ${pageData.first ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0)" onclick="loadData(${currentPage - 1})">Trước</a>
                    </li>
                `;

                // Page numbers
                for (let i = 0; i < pageData.totalPages; i++) {
                    if (i === currentPage) {
                        pagination.innerHTML += `<li class="page-item active"><span class="page-link">${i + 1}</span></li>`;
                    } else if (i < 5 || i > pageData.totalPages - 3 || (i > currentPage - 2 && i < currentPage + 2)) {
                        pagination.innerHTML += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="loadData(${i})">${i + 1}</a></li>`;
                    } else if (i === 5 || i === pageData.totalPages - 3) {
                        pagination.innerHTML += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                    }
                }

                // Next
                pagination.innerHTML += `
                    <li class="page-item ${pageData.last ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0)" onclick="loadData(${currentPage + 1})">Sau</a>
                    </li>
                `;
            }

            function deleteItem(id) {
                if (confirm('Bạn có chắc chắn muốn xóa bản ghi này?')) {
                    fetch(`/api/admin/iot/${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': 'Bearer ' + localStorage.getItem('token')
                        }
                    })
                        .then(response => response.json())
                        .then(res => {
                            if (res.success) {
                                loadData(currentPage);
                            } else {
                                alert('Lỗi: ' + res.message);
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('Đã xảy ra lỗi khi xóa');
                        });
                }
            }
        </script>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Thêm loại phòng</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/loai-phong}">Loại phòng</a></li>
                    <li class="breadcrumb-item active">Thêm mới</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-primary text-white py-3">
                            <h5 class="mb-0 fs-6 fw-bold"><i data-lucide="plus-circle" class="me-2"></i> Thêm loại phòng
                                mới</h5>
                        </div>
                        <div class="card-body p-4">
                            <form id="createForm">
                                <div class="row">
                                    <div class="col-md-8 mb-4">
                                        <label for="tenLoai" class="form-label fw-bold">Tên loại phòng <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control form-control-lg" id="tenLoai"
                                            placeholder="Ví dụ: Phòng máy tính, Phòng lý thuyết..." required>
                                    </div>
                                    <div class="col-md-4 mb-4">
                                        <label for="soPhong" class="form-label fw-bold">Số phòng</label>
                                        <input type="number" class="form-control form-control-lg" id="soPhong"
                                            placeholder="0" min="0">
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="moTa" class="form-label fw-bold">Mô tả</label>
                                    <textarea class="form-control" id="moTa" rows="4"
                                        placeholder="Nhập mô tả chi tiết về loại phòng này (tùy chọn)"></textarea>
                                </div>
                                <hr class="my-4">
                                <div class="d-flex gap-2 justify-content-end">
                                    <a th:href="@{/admin/loai-phong}" class="btn btn-light px-4">
                                        <i data-lucide="x" class="me-1"></i> Hủy
                                    </a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i data-lucide="save" class="me-1"></i> Lưu thông tin
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', () => lucide.createIcons());

            document.getElementById('createForm').addEventListener('submit', function (e) {
                e.preventDefault();
                const data = {
                    tenLoai: document.getElementById('tenLoai').value,
                    moTa: document.getElementById('moTa').value,
                    soPhong: document.getElementById('soPhong').value ? parseInt(document.getElementById('soPhong').value) : 0
                };
                fetch('/api/admin/loai-phong', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            alert('Thêm loại phòng thành công!');
                            window.location.href = '/admin/loai-phong';
                        } else {
                            alert('Lỗi: ' + (data.message || 'Không thể thêm'));
                        }
                    })
                    .catch(e => {
                        console.error('Error:', e);
                        alert('Có lỗi xảy ra trong quá trình lưu dữ liệu');
                    });
            });
        </script>
    </th:block>
</body>

</html>

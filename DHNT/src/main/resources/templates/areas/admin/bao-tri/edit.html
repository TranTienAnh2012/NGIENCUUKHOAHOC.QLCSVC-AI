<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Sửa phiếu bảo trì</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/bao-tri}">Bảo trì</a></li>
                    <li class="breadcrumb-item active">Sửa</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm">
                        <div class="card-header bg-warning text-dark">
                            <h5 class="mb-0"><i data-lucide="edit"></i> Cập nhật phiếu bảo trì</h5>
                        </div>
                        <div class="card-body">
                            <div id="loadingState" class="text-center py-5">
                                <div class="spinner-border text-primary"></div>
                                <p class="mt-2 text-muted">Đang tải...</p>
                            </div>
                            <form id="editForm" style="display:none;"><input type="hidden" id="itemId" th:value="${id}">
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label for="ngayBaoTri" class="form-label">Ngày bảo trì
                                            <span class="text-danger">*</span></label><input type="date"
                                            class="form-control" id="ngayBaoTri" required></div>
                                    <div class="col-md-6 mb-3">
                                        <label for="loaiBaoTri" class="form-label">Loại bảo trì <span
                                                class="text-danger">*</span></label>
                                        <select class="form-select" id="loaiBaoTri" required>
                                            <option value="DINH_KY">Định kỳ</option>
                                            <option value="SUA_CHUA">Sửa chữa</option>
                                            <option value="PHONG_NGUA">Phòng ngừa</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="nguoiThucHien" class="form-label">Người thực hiện</label>
                                        <input type="text" class="form-control" id="nguoiThucHien">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="chiPhi" class="form-label">Chi phí (VNĐ)</label>
                                        <input type="number" class="form-control" id="chiPhi" min="0">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="ketQua" class="form-label">Kết quả</label>
                                    <select class="form-select" id="ketQua">
                                        <option value="">-- Chọn kết quả --</option>
                                        <option value="THANH_CONG">Thành công</option>
                                        <option value="THAT_BAI">Thất bại</option>
                                        <option value="CAN_THAY_THE">Cần thay thế</option>
                                    </select>
                                </div>
                                <div class="mb-3"><label for="noiDung" class="form-label">Nội dung bảo
                                        trì</label><textarea class="form-control" id="noiDung" rows="4"></textarea>
                                </div>
                                <div class="d-flex gap-2 justify-content-end"><a th:href="@{/admin/bao-tri}"
                                        class="btn btn-secondary"><i data-lucide="x"></i> Hủy</a><button type="submit"
                                        class="btn btn-warning text-dark"><i data-lucide="save"></i> Cập nhật</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            const id = /*[[${id}]]*/ 0;
            document.addEventListener('DOMContentLoaded', () => {
                loadData();
                lucide.createIcons();
            });

            function loadData() {
                fetch(`/api/admin/bao-tri/${id}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            const item = data.data;
                            document.getElementById('ngayBaoTri').value = item.ngayBaoTri;
                            document.getElementById('loaiBaoTri').value = item.loaiBaoTri || '';
                            document.getElementById('nguoiThucHien').value = item.nguoiThucHien || '';
                            document.getElementById('chiPhi').value = item.chiPhi || '';
                            document.getElementById('noiDung').value = item.noiDung || '';
                            document.getElementById('ketQua').value = item.ketQua || '';
                            // Store thietBi info
                            window.currentThietBi = item.thietBi;
                            document.getElementById('loadingState').style.display = 'none';
                            document.getElementById('editForm').style.display = 'block';
                        } else {
                            alert('Không tìm thấy');
                            window.location.href = '/admin/bao-tri';
                        }
                    })
                    .catch(e => {
                        console.error('Error:', e);
                        alert('Có lỗi xảy ra');
                    });
            }

            document.getElementById('editForm').addEventListener('submit', function (e) {
                e.preventDefault();
                const data = {
                    ngayBaoTri: document.getElementById('ngayBaoTri').value,
                    loaiBaoTri: document.getElementById('loaiBaoTri').value,
                    nguoiThucHien: document.getElementById('nguoiThucHien').value,
                    chiPhi: document.getElementById('chiPhi').value ? parseFloat(document.getElementById('chiPhi').value) : null,
                    noiDung: document.getElementById('noiDung').value,
                    ketQua: document.getElementById('ketQua').value || null,
                    thietBi: window.currentThietBi
                };
                fetch(`/api/admin/bao-tri/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            alert('Cập nhật thành công!');
                            window.location.href = '/admin/bao-tri';
                        } else {
                            alert('Lỗi: ' + (data.message || 'Không thể cập nhật'));
                        }
                    })
                    .catch(e => {
                        console.error('Error:', e);
                        alert('Có lỗi xảy ra');
                    });
            });
        </script>
    </th:block>
</body>

</html>

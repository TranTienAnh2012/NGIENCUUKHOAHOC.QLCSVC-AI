<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Sửa phiếu mượn</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/muon-tra}">Mượn trả</a></li>
                    <li class="breadcrumb-item active">Sửa</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm">
                        <div class="card-header bg-warning text-dark">
                            <h5 class="mb-0"><i data-lucide="edit"></i> Cập nhật phiếu mượn</h5>
                        </div>
                        <div class="card-body">
                            <div id="loadingState" class="text-center py-5">
                                <div class="spinner-border text-primary"></div>
                                <p class="mt-2 text-muted">Đang tải...</p>
                            </div>
                            <form id="editForm" style="display:none;"><input type="hidden" id="itemId" th:value="${id}">
                                <div class="mb-3"><label for="trangThai" class="form-label">Trạng thái <span
                                            class="text-danger">*</span></label><select class="form-select"
                                        id="trangThai" required>
                                        <option value="DANG_MUON">Đang mượn</option>
                                        <option value="DA_TRA">Đã trả</option>
                                        <option value="QUA_HAN">Quá hạn</option>
                                    </select></div>
                                <div class="mb-3"><label for="ngayTra" class="form-label">Ngày trả thực tế</label><input
                                        type="date" class="form-control" id="ngayTra"></div>
                                <div class="mb-3"><label for="ghiChu" class="form-label">Ghi chú</label><textarea
                                        class="form-control" id="ghiChu" rows="3"></textarea></div>
                                <div class="d-flex gap-2 justify-content-end"><a th:href="@{/admin/muon-tra}"
                                        class="btn btn-secondary"><i data-lucide="x"></i> Hủy</a><button type="submit"
                                        class="btn btn-warning text-dark"><i data-lucide="save"></i> Cập nhật</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script
            th:inline="javascript">const id =/*[[${id}]]*/0; document.addEventListener('DOMContentLoaded', () => { loadData(); lucide.createIcons(); }); function loadData() { fetch(`/api/admin/muon-tra/${id}`).then(r => r.json()).then(data => { if (data.success) { const item = data.data; document.getElementById('trangThai').value = item.trangThai; document.getElementById('ngayTra').value = item.ngayTra || ''; document.getElementById('ghiChu').value = item.ghiChu || ''; document.getElementById('loadingState').style.display = 'none'; document.getElementById('editForm').style.display = 'block'; } else { alert('Không tìm thấy'); window.location.href = '/admin/muon-tra'; } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); }); } document.getElementById('editForm').addEventListener('submit', function (e) { e.preventDefault(); const data = { trangThai: document.getElementById('trangThai').value, ngayTra: document.getElementById('ngayTra').value || null, ghiChu: document.getElementById('ghiChu').value }; fetch(`/api/admin/muon-tra/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(r => r.json()).then(data => { if (data.success) { alert('Cập nhật thành công!'); window.location.href = '/admin/muon-tra'; } else { alert('Lỗi: ' + (data.message || 'Không thể cập nhật')); } }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); }); });</script>
    </th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Danh sách mượn trả</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1" th:text="${title}">Danh sách mượn trả</h4>
                            <p class="text-muted small mb-0">Quản lý phiếu mượn trả thiết bị</p>
                        </div><a th:href="@{/admin/muon-tra/create}" class="btn btn-primary"><i data-lucide="plus"></i>
                            Tạo phiếu mượn mới</a>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover" id="dataTable">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Người mượn</th>
                                            <th>Thiết bị</th>
                                            <th>Ngày mượn</th>
                                            <th>Ngày trả</th>
                                            <th>Trạng thái</th>
                                            <th>Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                            <nav>
                                <ul class="pagination justify-content-center" id="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            let currentPage = 0;
            const pageSize = 10;

            document.addEventListener('DOMContentLoaded', () => {
                loadData(0);
                lucide.createIcons();
            });

            function loadData(page) {
                fetch(`/api/admin/muon-tra?page=${page}&size=${pageSize}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            renderTable(data.data.content);
                            renderPagination(data.data);
                            currentPage = page;
                        }
                    })
                    .catch(e => console.error('Error:', e));
            }

            function renderTable(items) {
                const tbody = document.querySelector('#dataTable tbody');
                tbody.innerHTML = '';

                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Chưa có dữ liệu</td></tr>';
                    return;
                }

                items.forEach(item => {
                    const statusBadge = item.trangThai === 'DANG_MUON' ? 'bg-warning' :
                        item.trangThai === 'DA_TRA' ? 'bg-success' : 'bg-secondary';

                    const ngayTra = item.ngayTraThucTe ?
                        new Date(item.ngayTraThucTe).toLocaleDateString('vi-VN') :
                        (item.ngayTraDuKien ? new Date(item.ngayTraDuKien).toLocaleDateString('vi-VN') : '-');

                    tbody.innerHTML += `<tr>
                        <td>${item.id}</td>
                        <td>${item.nguoiMuon?.hoTen || '-'}</td>
                        <td>${item.thietBi?.tenThietBi || '-'}</td>
                        <td>${new Date(item.ngayMuon).toLocaleDateString('vi-VN')}</td>
                        <td>${ngayTra}</td>
                        <td><span class="badge ${statusBadge}">${item.trangThai}</span></td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a href="/admin/muon-tra/view/${item.id}" class="btn btn-info"><i data-lucide="eye"></i></a>
                                <a href="/admin/muon-tra/edit/${item.id}" class="btn btn-warning"><i data-lucide="edit"></i></a>
                                <button class="btn btn-danger" onclick="deleteItem(${item.id})"><i data-lucide="trash-2"></i></button>
                            </div>
                        </td>
                    </tr>`;
                });

                lucide.createIcons();
            }

            function renderPagination(pageData) {
                const pagination = document.getElementById('pagination');
                pagination.innerHTML = '';
                if (pageData.totalPages <= 1) return;

                for (let i = 0; i < pageData.totalPages; i++) {
                    pagination.innerHTML += `<li class="page-item ${i === pageData.currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="loadData(${i});return false;">${i + 1}</a>
                    </li>`;
                }
            }

            function deleteItem(id) {
                if (confirm('Bạn có chắc chắn muốn xóa?')) {
                    fetch(`/api/admin/muon-tra/${id}`, { method: 'DELETE' })
                        .then(r => r.json())
                        .then(data => {
                            if (data.success) {
                                alert('Xóa thành công!');
                                loadData(currentPage);
                            } else {
                                alert('Lỗi: ' + (data.message || 'Không thể xóa'));
                            }
                        })
                        .catch(e => {
                            console.error('Error:', e);
                            alert('Có lỗi xảy ra');
                        });
                }
            }
        </script>
    </th:block>
</body>

</html>

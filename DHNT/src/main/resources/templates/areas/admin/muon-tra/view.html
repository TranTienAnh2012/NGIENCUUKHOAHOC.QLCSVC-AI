<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Chi tiết phiếu mượn</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/muon-tra}">Mượn trả</a></li>
                    <li class="breadcrumb-item active">Chi tiết</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm">
                        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i data-lucide="eye"></i> Thông tin chi tiết phiếu mượn</h5>
                            <div class="btn-group"><a th:href="@{/admin/muon-tra/edit/{id}(id=${id})}"
                                    class="btn btn-sm btn-warning"><i data-lucide="edit"></i> Sửa</a><button
                                    class="btn btn-sm btn-danger" onclick="deleteItem()"><i data-lucide="trash-2"></i>
                                    Xóa</button></div>
                        </div>
                        <div class="card-body">
                            <div id="loadingState" class="text-center py-5">
                                <div class="spinner-border text-primary"></div>
                                <p class="mt-2 text-muted">Đang tải...</p>
                            </div>
                            <div id="dataDisplay" style="display:none;">
                                <dl class="row mb-0">
                                    <dt class="col-sm-4 text-muted">ID</dt>
                                    <dd class="col-sm-8" id="display-id">-</dd>
                                    <dt class="col-sm-4 text-muted">Người mượn</dt>
                                    <dd class="col-sm-8 fw-bold" id="display-nguoiDung">-</dd>
                                    <dt class="col-sm-4 text-muted">Thiết bị</dt>
                                    <dd class="col-sm-8 fw-bold" id="display-thietBi">-</dd>
                                    <dt class="col-sm-4 text-muted">Ngày mượn</dt>
                                    <dd class="col-sm-8" id="display-ngayMuon">-</dd>
                                    <dt class="col-sm-4 text-muted">Ngày trả dự kiến</dt>
                                    <dd class="col-sm-8" id="display-ngayTraDuKien">-</dd>
                                    <dt class="col-sm-4 text-muted">Ngày trả thực tế</dt>
                                    <dd class="col-sm-8" id="display-ngayTra">-</dd>
                                    <dt class="col-sm-4 text-muted">Trạng thái</dt>
                                    <dd class="col-sm-8" id="display-trangThai">-</dd>
                                    <dt class="col-sm-4 text-muted">Ghi chú</dt>
                                    <dd class="col-sm-8" id="display-ghiChu">-</dd>
                                </dl>
                            </div>
                        </div>
                        <div class="card-footer bg-light"><a th:href="@{/admin/muon-tra}" class="btn btn-secondary"><i
                                    data-lucide="arrow-left"></i> Quay lại</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            const id = /*[[${id}]]*/ 0;
            document.addEventListener('DOMContentLoaded', () => { 
                loadData(); 
                lucide.createIcons(); 
            }); 
            
            function parseDate(val) {
                if (!val) return null;
                if (Array.isArray(val)) {
                    const [y, m, d, h=0, min=0] = val;
                    return new Date(y, m - 1, d, h, min);
                }
                const d = new Date(val);
                return isNaN(d.getTime()) ? null : d;
            }

            function loadData() { 
                fetch(`/api/admin/muon-tra/${id}`)
                .then(r => r.json())
                .then(data => { 
                    if (data.success) { 
                        const item = data.data; 
                        document.getElementById('display-id').textContent = item.id; 
                        document.getElementById('display-nguoiDung').textContent = item.nguoiMuon?.hoTen || item.nguoiDung?.hoTen || 'Chưa có'; 
                        document.getElementById('display-thietBi').textContent = item.thietBi?.tenThietBi || 'Chưa có'; 
                        
                        const ngayMuon = parseDate(item.ngayMuon);
                        document.getElementById('display-ngayMuon').textContent = ngayMuon ? ngayMuon.toLocaleString('vi-VN') : 'Chưa có'; 
                        
                        const ngayTraDuKien = parseDate(item.ngayTraDuKien);
                        document.getElementById('display-ngayTraDuKien').textContent = ngayTraDuKien ? ngayTraDuKien.toLocaleString('vi-VN') : 'Chưa có'; 
                        
                        const ngayTraThucTe = parseDate(item.ngayTraThucTe);
                        document.getElementById('display-ngayTra').textContent = ngayTraThucTe ? ngayTraThucTe.toLocaleString('vi-VN') : 'Chưa trả'; 
                        
                        const statusBadge = item.trangThai === 'DANG_MUON' ? 'bg-warning' : item.trangThai === 'DA_TRA' ? 'bg-success' : 'bg-secondary'; 
                        document.getElementById('display-trangThai').innerHTML = `<span class="badge ${statusBadge}">${item.trangThai}</span>`; 
                        document.getElementById('display-ghiChu').textContent = item.ghiChu || 'Không có'; 
                        
                        document.getElementById('loadingState').style.display = 'none'; 
                        document.getElementById('dataDisplay').style.display = 'block'; 
                        lucide.createIcons(); 
                    } else { 
                        alert('Không tìm thấy'); 
                        window.location.href = '/admin/muon-tra'; 
                    } 
                }).catch(e => { 
                    console.error('Error:', e); 
                    alert('Có lỗi xảy ra'); 
                }); 
            } 
            
            function deleteItem() { 
                if (confirm('Bạn có chắc chắn muốn xóa?')) { 
                    fetch(`/api/admin/muon-tra/${id}`, { method: 'DELETE' })
                    .then(r => r.json())
                    .then(data => { 
                        if (data.success) { 
                            alert('Xóa thành công!'); 
                            window.location.href = '/admin/muon-tra'; 
                        } else { 
                            alert('Lỗi: ' + (data.message || 'Không thể xóa')); 
                        } 
                    }).catch(e => { console.error('Error:', e); alert('Có lỗi xảy ra'); }); 
                } 
            }
        </script>
    </th:block>
</body>

</html>

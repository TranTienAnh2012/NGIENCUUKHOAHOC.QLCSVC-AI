<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Danh sách thiết bị</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <!-- Header Section -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1" th:text="${title}">Danh sách thiết bị</h4>
                            <p class="text-muted small mb-0">Quản lý tất cả thiết bị trong hệ thống</p>
                        </div>
                        <a th:href="@{/admin/thiet-bi/create}" class="btn btn-primary">
                            <i data-lucide="plus"></i> Thêm thiết bị mới
                        </a>
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover" id="thietBiTable">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Tên thiết bị</th>
                                            <th>Mã thiết bị</th>
                                            <th>Loại</th>
                                            <th>Phòng</th>
                                            <th>Trạng thái</th>
                                            <th>Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Data will be loaded via JavaScript -->
                                    </tbody>
                                </table>
                            </div>

                            <!-- Pagination -->
                            <nav aria-label="Page navigation">
                                <ul class="pagination justify-content-center" id="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            let currentPage = 0;
            const pageSize = 10;

            document.addEventListener('DOMContentLoaded', function () {
                loadThietBi(0);
                lucide.createIcons();
            });

            function loadThietBi(page) {
                fetch(`/api/admin/thiet-bi?page=${page}&size=${pageSize}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            renderTable(data.data.content);
                            renderPagination(data.data);
                            currentPage = page;
                        }
                    })
                    .catch(error => {
                        console.error('Error loading data:', error);
                    });
            }

            function renderTable(items) {
                const tbody = document.querySelector('#thietBiTable tbody');
                tbody.innerHTML = '';

                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Chưa có dữ liệu</td></tr>';
                    return;
                }

                items.forEach(item => {
                    const statusBadge = item.trangThai === 'HOAT_DONG' ? 'bg-success' :
                        item.trangThai === 'BAO_TRI' ? 'bg-warning' :
                            item.trangThai === 'HONG' ? 'bg-danger' : 'bg-secondary';

                    const row = `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.tenThietBi}</td>
                        <td><code>${item.maThietBi}</code></td>
                        <td>${item.loaiThietBi?.tenLoai || '-'}</td>
                        <td>${item.phongHoc?.tenPhong || '-'}</td>
                        <td><span class="badge ${statusBadge}">${item.trangThai}</span></td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a href="/admin/thiet-bi/view/${item.id}" class="btn btn-info" title="Xem chi tiết">
                                    <i data-lucide="eye"></i>
                                </a>
                                <a href="/admin/thiet-bi/edit/${item.id}" class="btn btn-warning" title="Sửa">
                                    <i data-lucide="edit"></i>
                                </a>
                                <button class="btn btn-danger" onclick="deleteThietBi(${item.id})" title="Xóa">
                                    <i data-lucide="trash-2"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
                    tbody.innerHTML += row;
                });

                lucide.createIcons();
            }

            function renderPagination(pageData) {
                const pagination = document.getElementById('pagination');
                pagination.innerHTML = '';

                if (pageData.totalPages <= 1) return;

                for (let i = 0; i < pageData.totalPages; i++) {
                    const li = `<li class="page-item ${i === pageData.currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="loadThietBi(${i}); return false;">${i + 1}</a>
                </li>`;
                    pagination.innerHTML += li;
                }
            }

            function deleteThietBi(id) {
                if (confirm('Bạn có chắc chắn muốn xóa thiết bị này?')) {
                    fetch(`/api/admin/thiet-bi/${id}`, { method: 'DELETE' })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                alert('Xóa thành công!');
                                loadThietBi(currentPage);
                            } else {
                                alert('Lỗi: ' + (data.message || 'Không thể xóa thiết bị'));
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('Có lỗi xảy ra khi xóa thiết bị');
                        });
                }
            }
        </script>
    </th:block>
</body>

</html>

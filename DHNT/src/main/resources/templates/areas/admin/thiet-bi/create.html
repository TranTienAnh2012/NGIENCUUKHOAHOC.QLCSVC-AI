<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${title}">Thêm thiết bị mới</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/thiet-bi}">Thiết bị</a></li>
                    <li class="breadcrumb-item active">Thêm mới</li>
                </ol>
            </nav>

            <!-- Form Card -->
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i data-lucide="plus-circle"></i> Thêm thiết bị mới</h5>
                        </div>
                        <div class="card-body">
                            <form id="createForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="tenThietBi" class="form-label">Tên thiết bị <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="tenThietBi" required>
                                        <div class="invalid-feedback">Vui lòng nhập tên thiết bị</div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="maThietBi" class="form-label">Mã thiết bị <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="maThietBi" required>
                                        <div class="invalid-feedback">Vui lòng nhập mã thiết bị</div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="loaiThietBiId" class="form-label">Loại thiết bị <span
                                                class="text-danger">*</span></label>
                                        <select class="form-select" id="loaiThietBiId" required>
                                            <option value="">-- Chọn loại --</option>
                                        </select>
                                        <div class="invalid-feedback">Vui lòng chọn loại thiết bị</div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="phongHocId" class="form-label">Phòng học</label>
                                        <select class="form-select" id="phongHocId">
                                            <option value="">-- Chọn phòng --</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="trangThai" class="form-label">Trạng thái</label>
                                        <select class="form-select" id="trangThai">
                                            <option value="TOT" selected>Tốt</option>
                                            <option value="BAO_TRI">Bảo trì</option>
                                            <option value="HONG">Hỏng</option>
                                            <option value="THANH_LY">Thanh lý</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="ngayMua" class="form-label">Ngày mua</label>
                                        <input type="date" class="form-control" id="ngayMua">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="ghiChu" class="form-label">Ghi chú</label>
                                    <textarea class="form-control" id="ghiChu" rows="4"
                                        placeholder="Nhập ghi chú về thiết bị..."></textarea>
                                </div>

                                <div class="d-flex gap-2 justify-content-end">
                                    <a th:href="@{/admin/thiet-bi}" class="btn btn-secondary">
                                        <i data-lucide="x"></i> Hủy
                                    </a>
                                    <button type="submit" class="btn btn-primary">
                                        <i data-lucide="save"></i> Lưu thiết bị
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                loadLoaiThietBi();
                loadPhongHoc();
                lucide.createIcons();
            });

            function loadLoaiThietBi() {
                fetch('/api/admin/loai-thiet-bi/all')
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            const select = document.getElementById('loaiThietBiId');
                            data.data.forEach(item => {
                                const option = document.createElement('option');
                                option.value = item.id;
                                option.textContent = item.tenLoai;
                                select.appendChild(option);
                            });
                        }
                    })
                    .catch(error => console.error('Error loading loai thiet bi:', error));
            }

            function loadPhongHoc() {
                fetch('/api/admin/phong-hoc/all')
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            const select = document.getElementById('phongHocId');
                            data.data.forEach(item => {
                                const option = document.createElement('option');
                                option.value = item.id;
                                option.textContent = item.tenPhong;
                                select.appendChild(option);
                            });
                        }
                    })
                    .catch(error => console.error('Error loading phong hoc:', error));
            }

            document.getElementById('createForm').addEventListener('submit', function (e) {
                e.preventDefault();

                const form = e.target;
                if (!form.checkValidity()) {
                    form.classList.add('was-validated');
                    return;
                }

                const data = {
                    tenThietBi: document.getElementById('tenThietBi').value,
                    maThietBi: document.getElementById('maThietBi').value,
                    trangThai: document.getElementById('trangThai').value,
                    ngayMua: document.getElementById('ngayMua').value || null,
                    ghiChu: document.getElementById('ghiChu').value
                };

                const loaiId = document.getElementById('loaiThietBiId').value;
                if (loaiId) data.loaiThietBi = { id: parseInt(loaiId) };

                const phongId = document.getElementById('phongHocId').value;
                if (phongId) data.phong = { id: parseInt(phongId) };

                fetch('/api/admin/thiet-bi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('Thêm thiết bị thành công!');
                            window.location.href = '/admin/thiet-bi';
                        } else {
                            alert('Lỗi: ' + (data.message || 'Không thể thêm thiết bị'));
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Có lỗi xảy ra khi thêm thiết bị');
                    });
            });
        </script>
    </th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Truy Cập Bị Từ Chối · QLCSVC-AI</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 50%, #ff9a44 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            padding: 3rem 3.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 520px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-emoji {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 1rem;
            display: block;
        }

        .error-code {
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.75rem;
        }

        .error-message {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .badge-role {
            display: inline-block;
            background: #fff0f0;
            color: #e11d48;
            padding: 0.35rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border: 1px solid #fecdd3;
        }

        .btn-back {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
            margin: 0.35rem;
        }

        .btn-back:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.4);
        }

        .btn-outline-back {
            background: transparent;
            color: #ff416c;
            border: 2px solid #ff416c;
            padding: 0.7rem 1.75rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
            margin: 0.35rem;
        }

        .btn-outline-back:hover {
            background: #ff416c;
            color: white;
            transform: translateY(-2px);
        }

        .divider {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, #e2e8f0, transparent);
            margin: 1.5rem 0;
        }

        .system-name {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .tip-box {
            background: #fff7f7;
            border-left: 4px solid #ff416c;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            text-align: left;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="error-card">
        <span class="error-emoji">🔒</span>
        <div class="error-code">403</div>
        <div class="error-title">Truy cập bị từ chối</div>

        <div class="badge-role">⛔ Không đủ quyền hạn</div>

        <p class="error-message">
            Tài khoản của bạn <strong>không có quyền</strong> truy cập trang này.
            Mỗi vai trò chỉ được phép vào khu vực được phân quyền.
        </p>

        <div class="tip-box">
            💡 <strong>Gợi ý:</strong> Nếu bạn cần quyền truy cập, hãy liên hệ quản trị viên hệ thống.
        </div>

        <div>
            <a href="javascript:history.back()" class="btn-outline-back">← Quay lại</a>
            <a href="/" class="btn-back">🏠 Về trang chủ</a>
        </div>

        <hr class="divider">
        <p class="system-name">🏫 Hệ thống QLCSVC-AI · Trường DHNT</p>
    </div>
</body>

</html>

spring.application.name=Tta.QLCSVC

# =============================================
# DATABASE CONFIGURATION - XAMPP MySQL
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3307/qlcsvc_ai?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=tienanh2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JACKSON (JSON) CONFIGURATION
# =============================================
# Serialize LocalDate/LocalDateTime thành ISO string thay vì array [year, month, day]
spring.jackson.serialization.write-dates-as-timestamps=false

# =============================================
# JPA/HIBERNATE CONFIGURATION
# =============================================
# Tự động tạo/sửa schema (Hibernate sẽ tự tạo bảng LoaiPhong)
spring.jpa.hibernate.ddl-auto=update

# Hiển thị SQL queries trong console (development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect cho MySQL 8.0
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Encoding UTF-8
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# =============================================
# CONNECTION POOL (HikariCP)
# =============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================
# LOGGING
# =============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=INFO

# =============================================
# SERVER CONFIGURATION
# =============================================
server.port=8080
server.servlet.context-path=/

# =============================================
# FILE UPLOAD (cho hình ảnh thiết bị)
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# =============================================
# INTERNAL SERVICE API KEY
# Dùng để Flask AI server gọi /api/ai-data/**
# Phải khớp với INTERNAL_API_KEY trong .env Flask
# =============================================
internal.api-key=${INTERNAL_API_KEY:qlcsvc-internal-key-dhnt-2026-flask-secret}

# =============================================
# FLASK AI API URL
# =============================================
flask.ai.url=${FLASK_AI_URL:http://localhost:5000}

